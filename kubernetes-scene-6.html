const C={ink:'#172235',iv:'#F6F5EE',co:'#4667FF',te:'#16B99A',cr:'#FF765E',am:'#FFC65C',pe:'#A3A5F4',sl:'#73819A',dk:'#22314A',dd:'#0F1A2B'};
const SRT=`00:00.620 --> 00:03.950|Kenapa pelanggan masih sering kena error 502 Bad Gateway
00:03.950 --> 00:06.850|selama beberapa detik saat kamu melakukan rolling update aplikasi?
00:07.300 --> 00:09.650|Padahal katanya Kubernetes itu zero downtime.
00:10.150 --> 00:13.150|Penyebabnya adalah balapan waktu antara sinyal kematian SIGTERM
00:13.150 --> 00:15.550|dan pembaruan tabel rute kube-proxy.
00:16.200 --> 00:18.000|Saat pod lama hendak dimatikan,
00:18.000 --> 00:20.550|Kubernetes mengirim sinyal SIGTERM ke aplikasi
00:20.550 --> 00:23.450|bersamaan dengan perintah menghapus IP pod dari daftar service.
00:24.400 --> 00:29.850|Masalahnya, kube-proxy butuh waktu 1 sampai 3 detik untuk memperbarui aturan iptables di semua VPS,
00:30.300 --> 00:34.950|sehingga masih ada trafik pengunjung yang terlanjur nyelonong masuk ke pod yang sudah menutup pintunya.
00:35.950 --> 00:40.400|Solusi wajibnya, tambahkan preStop hook berisi perintah sleep 5 detik di YAML pod,
00:40.400 --> 00:44.750|dan terapkan graceful shutdown agar pod menyelesaikan sisa transaksi sebelum benar-benar mati.`;
const ps=s=>{const m=s.match(/(\d+):(\d+)\.(\d+)/);return +m[1]*60+ +m[2]+ +m[3]/1000};
const cues=SRT.split('\n').map(l=>{const[a,b]=l.split('|'),[s,e]=a.split(' --> ');return{a:ps(s),b:ps(e),x:b}});
/* ---- draw helpers ---- */
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),E=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,K=(u,s,d)=>E(cl((u-s)/d));
const BK=(u,s,d)=>{const x=cl((u-s)/d);return 1+2.7*Math.pow(x-1,3)+1.7*Math.pow(x-1,2)};
const G=(k,dy,f)=>{X.save();X.globalAlpha=cl(k);X.translate(0,(1-cl(k))*dy);f();X.restore()};
const al={middle:'center'};
const T=(x,y,s,z,f,w=800,a='middle',m=0)=>{X.font=`${w} ${z}px ${m?'"JetBrains Mono",monospace':'"Bricolage Grotesque",sans-serif'}`;X.textAlign=al[a]||a;X.fillStyle=f;X.fillText(s,x,y)};
const R=(x,y,w,h,r,f)=>{X.beginPath();X.roundRect(x,y,w,h,r);X.fillStyle=f;X.fill()};
const O=(x,y,r,f)=>{X.beginPath();X.arc(x,y,r,0,7);X.fillStyle=f;X.fill()};
const Pa=(d,f)=>{X.fillStyle=f;X.fill(new Path2D(d))};
