  <g id="globe" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle r="18"/><ellipse rx="8" ry="18"/><path d="M-18 0H18M-14.5 -9.5H14.5M-14.5 9.5H14.5"/></g>
  <text id="urlt" y="1244">https://alifpustaka.web.id</text>
</g>
</svg>
</div>
<button id="rp" type="button">↻ Putar ulang</button>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOutCubic=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>1+2.4*Math.pow(x-1,3)+1.4*Math.pow(x-1,2);
const S0=900/1621.3, LC=[122.7,132.9], LW=[810.65,132.9], DX=LW[0]-LC[0], K=2.2, TOTAL=4;
const RAW=[1217.5,916.5], CY=960;
const TAG='Ruang Literasi, Rumah Inovasi';
const logo=$('logo'), parts=[...logo.querySelectorAll('path')], letters=[...$('text').querySelectorAll('path')];
const bb=parts.map(p=>{const b=p.getBBox();return [b.x+b.width/2,b.y+b.height/2]});
const rnd=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(7);
const COL=['#2b1fff','#5b52ff','#8b85ff','#5b52ff','#2b1fff','#ff8b85'];
const NS='http://www.w3.org/2000/svg', mk=(n,at,par)=>{const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e};
const P=[...Array(34)].map(()=>{const a=rnd()*Math.PI*2,ring=rnd()<.22;return{a,sp:230+rnd()*330,t0:.3+rnd()*.25,life:.8+rnd()*.5,r:ring?7+rnd()*5:2.5+rnd()*4.5,ring,
  el:mk('circle',{fill:ring?'none':COL[Math.floor(rnd()*COL.length)],stroke:ring?COL[Math.floor(rnd()*3)]:'none','stroke-width':2.2},$('fx'))}});
const A=[...Array(16)].map(()=>({x:rnd()*1080,y:200+rnd()*1500,r:2+rnd()*3,ph:rnd(),el:mk('circle',{fill:'#5b52ff'},$('amb'))}));
let W=[], tagX=0, urlX=0;
function measure(){
  
  const tg=$('tag');
  for(let n=0;n<=TAG.length;n++){tg.textContent=TAG.slice(0,n)||' ';W[n]=n?tg.getComputedTextLength():0}
  tagX=540-W[TAG.length]/2; tg.setAttribute('x',tagX); tg.textContent='';
  const tw=$('urlt').getComputedTextLength(), tot=40+36+14+tw+40; urlX=540-tot/2;$('pill').setAttribute('x',urlX);$('pill').setAttribute('width',tot);
  $('urlt').setAttribute('x',urlX+90);
}
function render(t){
  const u=eInOut(prog(t,1.0,1.55)), z=eBack(prog(t,.1,.95));
  const kz=.12+(K-.12)*z, k=kz+(1-kz)*u, dx=DX*(1-u);
  logo.setAttribute('transform',`translate(${LC[0]+dx} ${LC[1]}) scale(${k}) translate(${-LC[0]} ${-LC[1]})`);
  logo.setAttribute('opacity',prog(t,.1,.35));
  parts.forEach((p,i)=>{
    const q=prog(t,.05+i*.04,.6+i*.04), e=eOutCubic(q), [cx,cy]=bb[i];
    let vx=cx-RAW[0], vy=cy-RAW[1]; const d=Math.hypot(vx,vy)||1; const m=70*(1-e)/d;
    p.setAttribute('transform',`translate(${vx*m} ${vy*m}) translate(${cx} ${cy}) scale(${.55+.45*e}) translate(${-cx} ${-cy})`);
    p.setAttribute('opacity',clamp(q*2.2));
  });
  const lx=540+(LC[0]+dx-LW[0])*S0, ly=CY;
  const g=$('glow'); g.setAttribute('cx',lx+(540-lx)*.5*u); g.setAttribute('cy',ly); g.setAttribute('opacity',prog(t,0,.6)*(1-.55*u));
  [['r1',.32,1.0,60,560,.4,2.4],['r2',.46,1.1,40,420,.28,1.6]].forEach(([id,a,b,r0,r1,al,sw])=>{
    const q=prog(t,a,b),e=eOutCubic(q),el=$(id);
    el.setAttribute('cx',540);el.setAttribute('cy',CY);el.setAttribute('r',r0+(r1-r0)*e);
    el.setAttribute('stroke-width',sw*(1-.6*q));el.setAttribute('opacity',q>0&&q<1?al*(1-q):0);
  });
  P.forEach(o=>{
    const a=(t-o.t0)/o.life;
    if(a<=0||a>=1){o.el.setAttribute('opacity',0);return}
    const d=o.sp*eOutCubic(a);
    o.el.setAttribute('cx',540+Math.cos(o.a)*d);o.el.setAttribute('cy',CY+Math.sin(o.a)*d);
    o.el.setAttribute('r',o.r*(o.ring?(.6+a*1.6):(1-a*.5)));o.el.setAttribute('opacity',Math.pow(1-a,1.4)*.9);
  });
  A.forEach(o=>{
    const f=(t*.12+o.ph)%1;
    o.el.setAttribute('cx',o.x);o.el.setAttribute('cy',o.y-t*28);o.el.setAttribute('r',o.r);
    o.el.setAttribute('opacity',Math.sin(Math.PI*f)*.16*prog(t,.2,.8));
  });
  letters.forEach((l,i)=>{
    const q=prog(t,1.1+i*.03,1.4+i*.03), e=eOutCubic(q);
    l.setAttribute('opacity',e);l.setAttribute('transform',`translate(${-34*(1-e)} 0)`);
  });
  
  
  const n=Math.floor(prog(t,1.75,2.95)*TAG.length+1e-6);
  $('tag').textContent=n?TAG.slice(0,n):'';
  const c=$('caret'); c.setAttribute('x',tagX+(W[n]||0)+4);
  let co=t<1.7?0:t<2.95?1:t<3.5?(Math.floor((t-2.95)/.18)%2?0:1):0; c.setAttribute('opacity',co);
  const uo=eOutCubic(prog(t,3.0,3.55)), ug=$('url');
  ug.setAttribute('opacity',uo);ug.setAttribute('transform',`translate(0 ${14*(1-uo)})`);
  $('globe').setAttribute('transform',`translate(${urlX+58} 1232)`);
}
let t0=0,raf=0;
function loop(now){
  const t=Math.min((now-t0)/1000,TOTAL);
  render(t);
  if(t<TOTAL)raf=requestAnimationFrame(loop);
}
function play(){cancelAnimationFrame(raf);t0=performance.now();raf=requestAnimationFrame(loop)}
$('rp').onclick=play;$('stage').onclick=play;
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'||e.key===' ')play()});
render(0);
const fl=document.querySelector('link[rel=stylesheet]');
const loadFonts=()=>Promise.all([document.fonts.load('700 46px Nunito',TAG),document.fonts.load('600 34px Nunito','https://alifpustaka.web.id')]).catch(()=>{});
const sheetReady=new Promise(r=>{if(fl.sheet)r();else{fl.addEventListener('load',r);fl.addEventListener('error',r)}});
document.fonts.addEventListener('loadingdone',()=>{measure();render(Math.min((performance.now()-t0)/1000,TOTAL))});
measure();
Promise.race([sheetReady.then(loadFonts),new Promise(r=>setTimeout(r,2000))]).then(()=>{measure();play()});
</script>
</body>
</html>
