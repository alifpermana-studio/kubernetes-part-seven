const eb = x => { x = cl(x); return 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2); };
const lp = (a, b, t) => a + (b - a) * t;

function drawThemeBg(g, w = 1080, h = 1920, tint = null, tintAlpha = 0) {
  g.save();
  g.fillStyle = K.bg;
  g.fillRect(0, 0, w, h);
  const sx = w / 1080, sy = h / 1920;
  g.fillStyle = K.bg2;
  g.beginPath(); g.arc(980 * sx, 160 * sy, 300 * sx, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(60 * sx, 1800 * sy, 360 * sx, 0, Math.PI * 2); g.fill();
  if (tint && tintAlpha > 0) {
    g.globalAlpha = tintAlpha;
    g.fillStyle = tint;
    g.fillRect(0, 0, w, h);
  }
  g.restore();
}

function drawR(g, x, y, w, h, r, fill, alpha = 1, stroke = null, lw = 4, dash = []) {
  if (w <= 0 || h <= 0) return;
  g.save();
  g.globalAlpha *= alpha;
  g.beginPath();
  g.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) {
    g.strokeStyle = stroke;
    g.lineWidth = lw;
    g.setLineDash(dash);
    g.stroke();
  }
  g.restore();
}

function drawC(g, x, y, r, fill, alpha = 1, stroke = null, lw = 4) {
  if (r <= 0) return;
  g.save();
  g.globalAlpha *= alpha;
  g.beginPath();
  g.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
  g.restore();
}

function drawT(g, txt, x, y, sz, col, wt = 700, align = 'center', alpha = 1, baseline = 'alphabetic', maxW = undefined) {
  g.save();
  g.globalAlpha *= alpha;
  g.font = `${wt} ${sz}px ${F_SANS}`;
  g.fillStyle = col;
  g.textAlign = align;
  g.textBaseline = baseline;
  if (maxW) g.fillText(String(txt), x, y, maxW);
  else g.fillText(String(txt), x, y);
  g.restore();
}

function drawLn(g, pts, col, lw = 6, alpha = 1, dash = []) {
  if (!pts || pts.length < 2) return;
  g.save();
  g.globalAlpha *= alpha;
  g.strokeStyle = col;
  g.lineWidth = lw;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.setLineDash(dash);
  g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
  g.stroke();
  g.restore();
}

function drawStar(g, cx, cy, r1, r2, n, rot, fill, alpha = 1) {
  g.save();
  g.globalAlpha *= alpha;
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r1 : r2;
    const a = rot + (i * Math.PI) / n;
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
  g.fillStyle = fill;
  g.fill();
  g.restore();
}

function drawSubtitleOverlay(g, text) {
  if (!text) return;
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.font = `600 38px ${F_SANS}`;
  const words = text.trim().split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (g.measureText(test).width > 880 && cur) {
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  const lh = 52;
  const bh = lines.length * lh + 32;
  const by = 1868 - bh;
  drawR(g, 60, by, 960, bh, 28, '#000000', 0.68, K.surf, 2);
  lines.forEach((line, idx) => {
    drawT(g, line, 540, by + 28 + idx * lh + 22, 38, K.iv, 600, 'center', 1);
  });
  g.restore();
}

function s1Stream(g, t, t0, n, tx, ty, col) {

    if (p < 0) continue;
    const c = (i % cols) - (cols - 1) / 2; // -3.5 .. +3.5 (100% symmetric around 0)
    const r = Math.floor(i / cols);
    const x0 = 270 + c * 64;
    const y0 = 250 + r * 22;
    const cx = lp(x0, tx + c * 7, eo(p));
    const cy = lp(y0, ty, p);
    drawC(g, cx, cy, 6, i % 2 ? K.peri : col, Math.min(1, p * 5) * (1 - pr(p, 0.88, 1)));
  }
}

function renderScene1(g, t, D1, showSub = true) {
  // Clamp structural timeline to D1 so any 2s post-scene hold keeps the final frame steady
  const tClamped = Math.min(t, D1 - 0.001);
  const scaleT = tClamped * (31.5037 / D1);
  let i = S1_B_REF.findIndex((b, j) => scaleT < S1_B_REF[j + 1]);
  if (i < 0 || i > 6) i = 6;
  const d = scaleT - S1_B_REF[i];
  const z = 1 + 0.035 * pr(scaleT, S1_B_REF[i], S1_B_REF[i + 1]);

  g.save();
  g.setTransform(2, 0, 0, 2, 0, 0);
  const drawIdx = (idx) => {
    g.save();
    g.translate(270, 480); g.scale(z, z); g.translate(-270, -480);
    renderScene1Sub(g, idx, scaleT);
    g.restore();
  };
  if (i > 0 && d < 0.55) {
    drawIdx(i - 1);
    g.save();
    g.beginPath();
    g.arc(270, 480, eo(d / 0.55) * 1100, 0, Math.PI * 2);
    g.clip();
    drawIdx(i);
    g.restore();
  } else {
    drawIdx(i);
  }
  g.restore();

  if (showSub) {
    const subT = t * (31.5037 / D1);
    const cue = S1_CUES_REF.find((c, idx) => subT >= c[0] - 0.05 && subT <= c[1] + (idx === S1_CUES_REF.length - 1 ? 1.8 : 0.15));
    if (cue) drawSubtitleOverlay(g, cue[2]);
  }
}

function s2Chef(g, x, y, s, m, t = 0, rot = 0) {

    g.moveTo(-34, 70); g.lineTo(-70, 20 + a);

    g.moveTo(-34, 74); g.lineTo(-52, 120);

  g.stroke();
  if (m === 'panic') {
    drawC(g, -70, 18 + a, 12, K.amb);

  drawC(g, 18, -52 + b, 20, K.wh);
  g.strokeStyle = K.ink;
  g.lineWidth = 4;
  g.beginPath();
  if (m === 'calm') {
    drawC(g, -14, -2 + b, 4, K.ink);
    drawC(g, 14, -2 + b, 4, K.ink);
    g.arc(0, 8 + b, 12, 0.2, Math.PI - 0.2);
    g.stroke();
  } else if (m === 'panic') {
    drawC(g, sh - 15, -3, 7, K.wh);

    drawC(g, sh - 15, -3, 3, K.ink);

    g.moveTo(-26, -18); g.lineTo(-10, -13);

    g.moveTo(-8, 22); g.quadraticCurveTo(0, 14, 8, 22);

  }
  g.restore();
}

function renderScene2(g, t, D2, showSub = true) {
  const tClamped = Math.min(t, D2 - 0.001);
  const scaleT = tClamped * (40.829 / D2);
  const scaleTCont = t * (40.829 / D2);
  let i = S2_FR_REF.findIndex((b, k) => scaleT >= b && scaleT < S2_FR_REF[k + 1]);
  if (i < 0 || i > 7) i = 7;
  const lStruct = scaleT - S2_FR_REF[i];
  const l = scaleTCont - S2_FR_REF[i];
  const len = S2_FR_REF[i + 1] - S2_FR_REF[i];
  const p = cl(lStruct / len);

  g.save();
  g.setTransform(2, 0, 0, 2, 0, 0);
  const drawAt = (k, pp, ll) => {
    g.save();
    const z = 1 + 0.035 * pp;
    g.translate(270, 480); g.scale(z, z); g.translate(-270, -480);
    renderScene2Sub(g, k, pp, ll);
    g.restore();
  };
  if (i > 0 && lStruct < 0.75) {
    drawAt(i - 1, 1, S2_FR_REF[i] - S2_FR_REF[i - 1]);
    g.save();
    g.beginPath();
    // All transitions centered at (270, 480)
    g.arc(270, 480, eio(lStruct / 0.75) * 1150, 0, Math.PI * 2);
    g.clip();
    drawAt(i, p, l);
    g.restore();
  } else {
    drawAt(i, p, l);
  }
  g.restore();

  if (showSub) {
    const cue = S2_CUES_REF.find((c, idx) => scaleTCont >= c[0] - 0.05 && scaleTCont <= c[1] + (idx === S2_CUES_REF.length - 1 ? 1.8 : 0.15));
    if (cue) drawSubtitleOverlay(g, cue[2]);
  }
}

function renderScene3(g, t, D3, showSub = true) {

  const scaleTCont = (t / D3) * 35.97;
  let i = S3_B_REF.findIndex((b, k) => scaleT < S3_B_REF[k + 1]);
  if (i < 0 || i > 4) i = 4;
  const d = S3_B_REF[i + 1] - S3_B_REF[i];
  const u = (scaleT - S3_B_REF[i]) / d;
  const lt = scaleTCont - S3_B_REF[i];

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  renderScene3Sub(g, i, u, lt);
  const tw = 0.6;
  if (i < 4 && scaleT > S3_B_REF[i + 1] - tw) {
    const p = eio((scaleT - (S3_B_REF[i + 1] - tw)) / tw);
    const r = p * 1700;
    g.save();
    g.beginPath(); g.arc(540, 960, r, 0, Math.PI * 2); g.clip();
    renderScene3Sub(g, i + 1, 0, 0);
    g.restore();
    drawC(g, 540, 960, r, null, 1, K.cor, 22);

  if (showSub) {
    const cue = S3_CUES_REF.find((c, idx) => scaleTCont >= c[0] - 0.05 && scaleTCont <= c[1] + (idx === S3_CUES_REF.length - 1 ? 1.8 : 0.15));
    if (cue) drawSubtitleOverlay(g, cue[2]);

}

function s4Bezier(a, b, c, d, t) {
  const u = 1 - t;
  return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d;
}

function renderScene4(g, t, D4, showSub = true) {
  const tClamped = Math.min(t, D4 - 0.001);
  const u = tClamped * (31.4 / D4);
  const uCont = t * (31.4 / D4);
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawThemeBg(g, 1080, 1920);

  // ---------------- TOP PANEL (y = 30..880): Deployment & ReplicaSet ----------------
  const dA = 1 - 0.55 * eio(pr(u, 19.6, 20.4)) + 0.55 * eio(pr(u, 26.6, 27.4));
  const z = 1 + 0.035 * eio(pr(u, 4.5, 10)) - 0.035 * eio(pr(u, 15, 19.5));
  drawR(g, 40, 30, 1000, 850, 36, K.ink, 0.9, K.surf, 4);

  g.save();
  g.globalAlpha = dA;
  drawT(g, 'Deployment & ReplicaSet', 540, 92, 40, K.iv, 800);
  drawT(g, 'Self-Healing & Rolling Update', 540, 136, 28, K.cor, 700);

  // Zoom centered at (540, 480)
  g.save();
  g.translate(540, 480); g.scale(z, z); g.translate(-540, -480);

  // HRD Robot centered at x = 540, y = 265
  const rEnter = eo(pr(u, 0.1, 0.8));
  const al = u > 10.5 && u < 14.5;
  g.save();
  g.globalAlpha *= rEnter;
  s4Robot(g, 540, 260 + (al ? Math.sin(uCont * 40) * 3 : 0) - (1 - rEnter) * 50, 0.72, al, u > 14.5 && u < 16.5);
  drawT(g, 'Deployment & ReplicaSet (HRD)', 540, 368, 23, K.peri, 700);
  g.restore();

  // 3 Pod desks symmetrically centered at x = 240, 540, 840 (540 - 300, 540, 540 + 300)
  let n = 0;
  const deskX = [240, 540, 840];
  for (let i = 0; i < 3; i++) {
    const a = eo(pr(u, 0.8 + i * 0.35, 1.5 + i * 0.35));
    if (a <= 0) continue;
    const sw = [16.6, 17.2, 17.8][i];
    let st = u >= sw ? 'v2' : 'ok';
    let sc = 0.76;
    if (i === 1) {
      if (u >= 10.5 && u < 14.2) { st = 'boom'; sc = 0.76 * eo(pr(u, 10.5, 11.0)); }
      else if (u >= 14.2 && u < 15.6) { st = 'new'; sc = 0.76 * eo(pr(u, 14.2, 15.0)); }
    }
    if (!(i === 1 && u >= 10.5 && u < 15.0) && a > 0.9) n++;
    const pulse = 1 + 0.08 * Math.sin(Math.PI * pr(u, sw, sw + 0.4));
    s4Desk(g, deskX[i], 545 - 50 * (1 - a), sc * pulse * (0.5 + 0.5 * a), st, 'pod-' + 'abc'[i], u >= sw ? 'v2' : 'v1', a);
  }

  // Rolling update bar centered at x = 540 (220..860, w = 640)
  drawR(g, 220, 725, 640, 12, 6, K.surf);
  drawR(g, 220, 725, 640 * pr(u, 16.4, 18.2), 12, 6, K.cob);

  // Status pill centered at x = 540 (220..860, w = 640)
  const msg = u < 10.5 ? `ReplicaSet · berjalan ${n}/3`
    : u < 15.0 ? `Pod pengganti · berjalan ${n}/3`
    : u < 18.4 ? 'Rolling Update: v1 → v2'
    : 'ReplicaSet · berjalan 3/3';
  drawR(g, 220, 755, 640, 68, 34, K.surf, 1, K.peri, 2);
  drawC(g, 275, 789, 12, (n < 3 && u > 1.5) ? K.cor : K.teal);
  drawT(g, msg, 555, 799, 28, K.iv, 700, 'center');
  g.restore();
  g.restore();

  // ---------------- DIVIDER PROGRESS BAR (y = 895) ----------------
  drawR(g, 40, 895, 1000, 8, 4, K.surf);
  drawR(g, 40, 895, 1000 * cl(tClamped / D4), 8, 4, K.cob);

  // ---------------- BOTTOM PANEL (y = 920..1690): Ingress (L7) & Service (L4) ----------------
  const bA = 0.4 + 0.6 * eio(pr(u, 19.6, 20.4));
  drawR(g, 40, 920, 1000, 770, 36, K.ink, 0.9, K.surf, 4);
  g.save();
  g.globalAlpha = bA;
  drawT(g, 'Ingress (L7) & Service (L4)', 540, 980, 40, K.iv, 800);
  drawT(g, 'Rute trafik pengunjung ke Pod sehat', 540, 1022, 26, K.amb, 700);

  // Symmetric customer streams from BOTH left (90..410) and right (990..670) toward center (540)
  for (let k = 0; k < 4; k++) {
    const p = ((uCont * 65 + k * 80) % 320) / 320;
    const al = Math.min(1, p * 4, (1 - p) * 4);
    const col = [K.cor, K.amb, K.peri, K.teal][k];
    const dy = 1155 - (k % 2) * 28 + Math.sin(uCont * 8 + k) * 3;
    s4Person(g, lp(90, 405, p), dy, 0.95, col, al);
    s4Person(g, lp(990, 675, p), dy, 0.95, col, al);
  }

  // L7 Ingress Arch centered at x = 540 (440..640)
  const gw = 14 + (u > 20.4 ? 3 * Math.sin(uCont * 6) : 0);
  g.save();
  g.strokeStyle = K.amb; g.lineWidth = gw; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(440, 1215); g.lineTo(440, 1135);
  g.quadraticCurveTo(540, 1055, 640, 1135);
  g.lineTo(640, 1215);
  g.stroke();
  g.restore();
  drawR(g, 480, 1170, 120, 14, 7, K.amb);
  drawT(g, 'L7 · Ingress', 540, 1142, 26, K.amb, 800);

  // Vertical connection at x = 540 from Ingress (1215) to Service (1295)
  drawLn(g, [[540, 1215], [540, 1295]], K.amb, 8);

  // L4 Service (ClusterIP) centered at x = 540 (410..670, w = 260)
  drawR(g, 410, 1295, 260, 74, 22, K.cob, 1, K.peri, 3);
  drawT(g, 'Service (L4)', 540, 1328, 25, K.iv, 800);
  drawT(g, 'ClusterIP tetap', 540, 1356, 20, K.amb, 700);

  // 3 Pod desks symmetrically centered at px = [200, 540, 880] (540 - 340, 540, 540 + 340)
  const px = [200, 540, 880];
  const act = uCont > 20.4 ? Math.floor((uCont - 20.4) / 0.6) % 3 : -1;
  px.forEach((x, i) => {
    const on = i === act;
    g.save();
    g.strokeStyle = on ? K.amb : K.peri;
    g.lineWidth = on ? 9 : 5;
    g.setLineDash(on ? [] : [4, 12]);
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(540, 1369);
    g.bezierCurveTo(540, 1445, x, 1435, x, 1500);
    g.stroke();
    g.restore();
    s4Desk(g, x, 1565, 0.56, u >= 19.6 ? 'v2' : 'ok', 'pod-' + 'abc'[i], u >= 19.6 ? 'v2' : 'v1');
  });

  // 'Pod baru' highlight box centered at x = 540 (450..630, w = 180)
  if (u > 26.2) {
    drawR(g, 450, 1455, 180, 215, 24, null, 1, K.amb, 5, [12, 10]);
    drawT(g, 'Pod baru aktif', 540, 1442, 23, K.amb, 800);
  }

  // Animated request packets along the symmetric Bezier curves
  for (let k = 0; k < 24; k++) {
    const p = (uCont - 20.4 - k * 0.6) / 1.3;
    if (p > 0 && p < 1) {
      const q = eo(p);
      const x = px[k % 3];
      const bx = s4Bezier(540, 540, x, x, q);
      const by = s4Bezier(1369, 1445, 1435, 1500, q);
      drawC(g, bx, by, 13, [K.cor, K.amb, K.teal][k % 3]);
    }
  }
  g.restore();
  g.restore();

  if (showSub) {
    const cue = S4_CUES_REF.find((c, idx) => uCont >= c[0] - 0.05 && uCont <= c[1] + (idx === S4_CUES_REF.length - 1 ? 1.8 : 0.15));
    if (cue) drawSubtitleOverlay(g, cue[2]);
  }
}

function s5Poly(g, pts, fill) {
  g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
  g.closePath();
  g.fillStyle = fill;
  g.fill();
}

function s5Arrow(g, x1, y1, x2, y2, col, on) {
  g.save();
  g.strokeStyle = col;
  g.fillStyle = col;
  g.lineWidth = on ? 7 : 4;
  g.globalAlpha *= on ? 1 : 0.32;
  g.setLineDash(on ? [] : [14, 12]);
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x1, y1);
  let a;
  if (Math.abs(y1 - y2) < 2) {
    g.lineTo(x2 - 14, y2);
    a = 0;
  } else {
    const m = (y1 + y2) / 2;
    g.bezierCurveTo(x1, m, x2, m, x2, y2 - 14);
    a = Math.PI / 2;
  }
  g.stroke();
  g.setLineDash([]);
  g.translate(x2, y2);
  g.rotate(a);
  s5Poly(g, [[0, 0], [-20, -12], [-20, 12]], col);
  g.restore();
}

function s5Node(g, k, on) {
  const n = S5_N[k], h = 76;
  g.save();

const S5_S = [
  { fn: s5H1, an: [], ae: [] },
  { fn: s5H2, an: [], ae: [] },
  { fn: s5H3, an: ['api'], ae: [] },
  { fn: s5H4, an: ['api', 'etcd'], ae: [0] },

  { fn: s5H6, an: ['api', 'sch'], ae: [1] },
  { fn: s5H7, an: ['sch', 'kl', 'cd'], ae: [3, 4] },
  { fn: s5H8, an: Object.keys(S5_N), ae: [0, 1, 2, 3, 4, 5] }
];

function getS5Schedule(D5) {
  const w = S5_TXT.map(s => s.length);
  const tot = w.reduce((a, b) => a + b, 0);
  let a = 0.2;
  const cues = S5_TXT.map((s, i) => {
    const d = (D5 - 0.5) * w[i] / tot;
    const o = { a, b: a + d, s };
    a += d;
    return o;
  });
  const B = [0, 2, 3, 5, 6, 7, 8, 9].map(j => cues[j].a);
  B[0] = 0;
  B.push(D5);
  return { cues, B };
}

function s5Ep(k) {
  const [a, b] = S5_E[k], A = S5_N[a], T = S5_N[b];
  return a === 'kl' ? [[A.x + A.w / 2, A.y], [T.x - T.w / 2, T.y]] : [[A.x, A.y + 38], [T.x, T.y - 38]];
}

function s5Bez(a, b, s) {
  if (Math.abs(a[1] - b[1]) < 2) return [a[0] + (b[0] - a[0]) * s, a[1]];
  const m = (a[1] + b[1]) / 2, u = 1 - s;
  return [
    u * u * u * a[0] + 3 * u * u * s * a[0] + 3 * u * s * s * b[0] + s * s * s * b[0],
    u * u * u * a[1] + 3 * u * u * s * m + 3 * u * s * s * m + s * s * s * b[1]
  ];
}

function renderScene5(g, t, D5, showSub = true) {
  const { cues, B } = getS5Schedule(D5);
  const tClamped = Math.min(t, D5 - 0.001);
  let i = 0;
  while (i < 7 && tClamped >= B[i + 1]) i++;
  const s = S5_S[i];
  const tlStruct = tClamped - B[i];
  const tl = t - B[i];
  const pv = i ? S5_S[i - 1] : { an: [], ae: [] };
  const nx = i < 7 ? S5_S[i + 1] : { an: s.an, ae: s.ae };
  const en = eo(Math.min(1, tlStruct / 0.55));
  const ex = i < 7 ? eo(Math.max(0, (tClamped - B[i + 1] + 0.42) / 0.42)) : 0;
  const vis = en * (1 - ex);
  const col = [K.cob, K.teal, K.cor, K.amb, K.peri, K.cob, K.teal, K.cor][i];
  const lv = (a, b, n, k) => a.includes(k) ? (b.includes(k) ? 1 : en) * (n.includes(k) ? 1 : 1 - ex) : 0;
  const lN = {}, lE = {};
  Object.keys(S5_N).forEach(k => lN[k] = lv(s.an, pv.an, nx.an, k));
  S5_E.forEach((_, k) => lE[k] = lv(s.ae, pv.ae, nx.ae, k));

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawThemeBg(g, 1080, 1920);
  s5Formula(g);
  s5Bottom(g, lN, lE);

  // Symmetric center radial clip at (540, 600) with zero horizontal exit drift
  g.save();
  g.beginPath();
  g.arc(540, 600, Math.max(1, vis * 920), 0, Math.PI * 2);
  g.clip();
  const z = 1 + 0.03 * cl(tlStruct / (B[i + 1] - B[i]));
  g.translate(540, 600); g.scale(z, z); g.translate(-540, -600);
  g.translate(0, (1 - en) * 60 + Math.sin(tl * 1.6) * 4);
  if (i === 1) {
    g.beginPath();
    g.rect(0, 260, 350 + 650 * eo(Math.min(1, tlStruct / 1.4)), 680);
    g.clip();
  }
  s.fn(g);
  g.restore();

  if (vis > 0 && vis < 0.99) {
    drawC(g, 540, 600, vis * 920, null, 1, col, 6 + 24 * (1 - vis));
  }
  if (tlStruct > 0.4) {
    s.ae.forEach((k, j) => {
      const [a, b] = s5Ep(k);
      const q = s5Bez(a, b, (tl * 0.7 + j * 0.3) % 1);
      drawC(g, q[0], q[1], 11, K.amb, lE[k], K.ink, 4);
    });
  }
  if (tlStruct > 0.4 && tlStruct < 1.5 && s.an.length) {
    const n = S5_N[s.an[s.an.length - 1]];
    const r = Math.sin(((tlStruct - 0.4) / 1.1) * Math.PI);
    if (r > 0) {
      drawR(g, n.x - n.w / 2 - 10 * r, n.y - 44 - 6 * r, n.w + 20 * r, 88 + 12 * r, 26, null, r * (1 - ex), K.amb, 5);
    }
  }
  g.restore();

  if (showSub) {
    const q = cues.find((c, idx) => t >= c.a - 0.05 && t <= c.b + (idx === cues.length - 1 ? 1.8 : 0.15));
    if (q) drawSubtitleOverlay(g, q.s);
  }
}

function renderScene6(g, t, D6, showSub = true) {
  const tClamped = Math.min(t, D6 - 0.001);
  const scaleT = tClamped * (46.5 / D6);
  const scaleTCont = t * (46.5 / D6);
  g.save();
  g.setTransform(2, 0, 0, 2, 0, 0);
  drawThemeBg(g, 540, 960);

  // Top panel (24..516, center 270)
  drawR(g, 24, 24, 492, 415, 26, K.ink, 0.95, K.surf, 3);
  g.save();
  g.beginPath(); g.roundRect(24, 24, 492, 415, 26); g.clip();
  drawR(g, 24, 24, 492, 36, 0, K.surf);
  [K.cor, K.amb, K.teal].forEach((c, i) => drawC(g, 48 + i * 18, 42, 5, c));
  drawT(g, 'Simulasi Trafik K8s', 270, 47, 13, K.iv, 700, 'center');
  s6DrawTop(g, scaleT, scaleTCont);
  g.restore();

  drawT(g, 'HPA Scale Out (Wajib Stateless) + Cluster Autoscaler', 270, 466, 15, K.peri, 700);

  // Symmetric VPS 1 & VPS 2 buildings:
  // Before t=32: VPS 1 centered at x=110, w=320, h=205 (110..430, center 270)
  // After t=32: VPS 1 at x=30, w=230, h=205 (30..260, center 145) & VPS 2 at x=280, w=230, h=205 (280..510, center 395)
  const m = eio(pr(scaleT, 32, 34));
  const bx = lp(110, 30, m), by = 510, bw = lp(320, 230, m), bh = 205;
  s6Bld(g, bx, by, bw, bh, scaleT < 32.5 ? 'Gedung VPS 1 (RAM 4 GB)' : 'VPS 1 (8/8 Pod)', 1);

  const cnt = scaleT < 11 ? 3 : Math.min(8, 3 + Math.floor((scaleT - 11) / 0.6));
  for (let i = 0; i < cnt; i++) {
    const s = s6Slot(bx, by, bw, bh, i);
    s6Pod(g, s[0], s[1], s[2], s[3], K.teal);
  }

  if (scaleT >= 33.2) {
    const o = eio(pr(scaleT, 33.2, 37.5));
    s6Bld(g, 280, by + (1 - o) * 160, 230, 205, 'VPS 2 (2/8 Pod)', eio(pr(scaleT, 33.2, 34.8)));
  }

  if (scaleT >= 21.2) {
    const pk = eio(pr(scaleT, 39.5, 42.0));
    const cm = eio(pr(scaleT, 41.5, 43.0));
    const ent = eio(pr(scaleT, 21.2, 22.2));
    for (let i = 0; i < 2; i++) {
      // Wait symmetrically at right before VPS 2 rises, then land in VPS 2's exact slots 0 and 1
      const A = [lp(545, 445, ent), 545 + i * 74, 68, 56];
      const B = [325 + i * 78, 435, 62, 50];
      const Cc = s6Slot(280, by, 230, 205, i);
      let p = A.map((v, j) => lp(v, B[j], m));
      p = p.map((v, j) => lp(v, Cc[j], pk));
      s6Pod(g, p[0], p[1], p[2], p[3], s6MixCol(K.amb, K.teal, cm));
      if (scaleT > 22.2 && scaleT < 40.0) {
        drawT(g, 'Pending', p[0] + p[2] / 2, p[1] + p[3] + 14, 12, K.amb, 800);
      }
    }
  }

  // Symmetric RAM 4 GB bar at x = 40..500 (w = 460, center 270)
  if (scaleT >= 5.2) {
    const bX = 40, bY = 755, bW = 460;
    const sysFull = 78; // 696 / 4096 * 460 = 78.17px
    const sw = sysFull * eio(pr(scaleT, 5.2, 6.5));
    drawT(g, 'Kapasitas VPS 1: RAM 4 GB (696 MB Sistem + 3.400 MB Allocatable)', 270, 744, 13, K.iv, 700);
    drawR(g, bX - 3, bY - 3, bW + 6, 36, 10, K.ink, 1, K.surf, 2);
    drawR(g, bX, bY, sw, 30, 6, K.sl);
    drawR(g, bX + sysFull, bY, bW - sysFull, 30, 6, K.surf);
    const slotW = (bW - sysFull) / 8; // 382 / 8 = 47.75px
    for (let i = 0; i < cnt; i++) {
      if (scaleT >= 11) {
        drawR(g, bX + sysFull + 2 + i * slotW, bY + 2, slotW - 4, 26, 4, K.teal);
      }
    }
  }

  // Subtle radial pulse at section boundaries centered at (270, 480)
  const wd = S6_BND_REF.findIndex(b => b > 0 && Math.abs(scaleT - b) < 0.3 && b < 46);
  if (wd >= 0) {
    const d = Math.abs(scaleT - S6_BND_REF[wd]);
    drawC(g, 270, 480, (1 - d / 0.3) * 650, null, (1 - d / 0.3) * 0.35, K.cob, 16);
  }
  g.restore();

  if (showSub) {
    const cue = S6_CUES_REF.find((c, idx) => scaleTCont >= c[0] - 0.05 && scaleTCont <= c[1] + (idx === S6_CUES_REF.length - 1 ? 1.8 : 0.15));
    if (cue) drawSubtitleOverlay(g, cue[2]);
  }
}

function renderScene7(g, t, D7, showSub = true) {
  const tClamped = Math.min(t, D7 - 0.001);
  const scaleT = tClamped * (33.67 / D7);
  const scaleTCont = t * (33.67 / D7);
  let i = 0;
  while (i < 6 && scaleT >= S7_BR_REF[i + 1]) i++;
  const L = S7_BR_REF[i + 1] - S7_BR_REF[i];
  const s = scaleT - S7_BR_REF[i];
  const sCont = scaleTCont - S7_BR_REF[i];

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawThemeBg(g, 1080, 1920);
  g.save();
  const z = 1 + 0.035 * cl(s / L);
  g.translate(540, 960); g.scale(z, z); g.translate(-540, -960);
  renderScene7Sub(g, i, s, L, sCont);
  g.restore();

  // Symmetric center radial transition at (540, 960)
  const WC = [K.cob, K.teal, K.cor, K.cob, K.teal, K.cor];
  for (let b = 1; b < 7; b++) {
    const d = scaleT - S7_BR_REF[b];
    if (Math.abs(d) < 0.35) {
      const p = 1 - Math.abs(d) / 0.35;
      drawC(g, 540, 960, eio(p) * 1200, null, p * 0.45, WC[b - 1], 24);
    }
  }
  g.restore();

  if (showSub) {
    const cue = S7_CUES_REF.find((c, idx) => scaleTCont >= c[0] - 0.05 && scaleTCont <= c[1] + (idx === S7_CUES_REF.length - 1 ? 1.8 : 0.15));
    if (cue) drawSubtitleOverlay(g, cue[2]);
  }
}

function s8Arrow(g, pts, col, lw = 10) {
  drawLn(g, pts, col, lw);
  const a = pts[pts.length - 1], b = pts[pts.length - 2];
  const an = Math.atan2(a[1] - b[1], a[0] - b[0]);
  g.save();
  g.beginPath();
  g.moveTo(a[0] + Math.cos(an) * 18, a[1] + Math.sin(an) * 18);
  g.lineTo(a[0] + Math.cos(an + 2.4) * 22, a[1] + Math.sin(an + 2.4) * 22);
  g.lineTo(a[0] + Math.cos(an - 2.4) * 22, a[1] + Math.sin(an - 2.4) * 22);
  g.closePath();
  g.fillStyle = col;
  g.fill();
  g.restore();
}

function renderScene8(g, t, D8, showSub = true) {
  const scaleT = cl(t, 0, D8 - 0.001);
  const T = S8_B_FRAC.map(b => b * D8);
  let i = 0;
  while (i < 4 && scaleT >= T[i + 1]) i++;
  const lStruct = scaleT - T[i], l = t - T[i], len = T[i + 1] - T[i];

  const drawSub = (idx, llStruct, llCont, llen) => {
    g.save();
    const p = cl(llStruct / llen), z = 1 + 0.035 * p;
    g.translate(540, 960); g.scale(z, z); g.translate(-540, -960);
    const e = eio(cl(llStruct / 0.55));
    g.translate(0, (1 - e) * 45);
    renderScene8Sub(g, idx, llCont);
    g.restore();
  };

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawThemeBg(g, 1080, 1920);
  if (i > 0 && lStruct < 0.65) {
    drawSub(i - 1, T[i] - T[i - 1] + lStruct, T[i] - T[i - 1] + lStruct, T[i] - T[i - 1]);
    g.save();
    g.beginPath(); g.arc(540, 960, eio(lStruct / 0.65) * 1500, 0, Math.PI * 2); g.clip();
    drawThemeBg(g, 1080, 1920);
    drawSub(i, lStruct, l, len);
    g.restore();
  } else {
    drawSub(i, lStruct, l, len);
  }
  g.restore();

  if (showSub) {
    const refT = t * (12.617 / D8);
    const cue = S8_CUES_REF.find((c, idx) => refT >= c[0] - 0.05 && refT <= c[1] + (idx === S8_CUES_REF.length - 1 ? 1.8 : 0.15));
    if (cue) drawSubtitleOverlay(g, cue[2]);
  }
}

  const rnd = (s => () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  })(7);
  const COL = ['#2b1fff', '#5b52ff', '#8b85ff', '#5b52ff', '#2b1fff', '#ff8b85'];
  const P = [...Array(34)].map(() => {
    const a = rnd() * Math.PI * 2, ring = rnd() < 0.22;
    const sp = 230 + rnd() * 330, t0 = 0.3 + rnd() * 0.25, life = 0.8 + rnd() * 0.5;
    const r = ring ? 7 + rnd() * 5 : 2.5 + rnd() * 4.5;
    const col = ring ? COL[Math.floor(rnd() * 3)] : COL[Math.floor(rnd() * COL.length)];
    return { a, sp, t0, life, r, ring, col };
  });
  const A = [...Array(16)].map(() => ({
    x: rnd() * 1080,
    y: 200 + rnd() * 1500,
    r: 2 + rnd() * 3,
    ph: rnd()
  }));
  return { P, A };
})();

    if (grd && typeof grd.addColorStop === 'function') {

    const d = o.sp * eo(a);
    const px = 540 + Math.cos(o.a) * d;
    const py = CY + Math.sin(o.a) * d;
    const rad = o.r * (o.ring ? (0.6 + a * 1.6) : (1 - a * 0.5));
    const op = Math.pow(1 - a, 1.4) * 0.9;
    if (o.ring) drawC(g, px, py, rad, null, op, o.col, 2.2);
    else drawC(g, px, py, rad, o.col, op);

  if (logoOp > 0 && _alifLogoPath2D) {

    ALIF_LOGO_PARTS.forEach((part, i) => {

    if (typeof g.ellipse === 'function') g.ellipse(gx2, gy2, 8, 18, 0, 0, Math.PI * 2);
    g.moveTo(gx2 - 18, gy2); g.lineTo(gx2 + 18, gy2);
    g.moveTo(gx2 - 14.5, gy2 - 9.5); g.lineTo(gx2 + 14.5, gy2 - 9.5);
    g.moveTo(gx2 - 14.5, gy2 + 9.5); g.lineTo(gx2 + 14.5, gy2 + 9.5);
    g.stroke();
    g.restore();

    g.fillStyle = K.wh;
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillText(URL_TXT, urlX + 90, 1244);
    g.restore();
  }

  g.restore();
}


const RENDER_FN = [
  renderScene1,
  renderScene2,
  renderScene3,
  renderScene4,
  renderScene5,
  renderScene6,
  renderScene7,
  renderScene8
][SCENE_NUM - 1];

function getSceneCues() {
  const padLast = arr => arr.map((c, idx) => [c[0], c[1] + (idx === arr.length - 1 ? 1.8 : 0), c[2]]);
  if (SCENE_NUM === 1) return padLast(S1_CUES_REF.map(c => [c[0] * VO_D / 31.5037, c[1] * VO_D / 31.5037, c[2]]));
  if (SCENE_NUM === 2) return padLast(S2_CUES_REF.map(c => [c[0] * VO_D / 40.829, c[1] * VO_D / 40.829, c[2]]));
  if (SCENE_NUM === 3) return padLast(S3_CUES_REF.map(c => [c[0] * VO_D / 35.97, c[1] * VO_D / 35.97, c[2]]));
  if (SCENE_NUM === 4) return padLast(S4_CUES_REF.map(c => [c[0] * VO_D / 31.4, c[1] * VO_D / 31.4, c[2]]));
  if (SCENE_NUM === 5) return padLast(getS5Schedule(VO_D).cues.map(c => [c.a, c.b, c.s]));
  if (SCENE_NUM === 6) return padLast(S6_CUES_REF.map(c => [c[0] * VO_D / 46.5, c[1] * VO_D / 46.5, c[2]]));
  if (SCENE_NUM === 7) return padLast(S7_CUES_REF.map(c => [c[0] * VO_D / 33.67, c[1] * VO_D / 33.67, c[2]]));
  return padLast(S8_CUES_REF.map(c => [c[0] * VO_D / 12.617, c[1] * VO_D / 12.617, c[2]]));
}

function render(t) {
  RENDER_FN(g, cl(t, 0, D - 0.001), VO_D, cC.checked);
}

const fmt = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
let ctx, vb, mb, sb, gV, gM, gS, mdest, srcs = [], playing = false, off = 0, t0 = 0, exporting = false, rec, chunks = [];
const clock = () => playing ? off + ctx.currentTime - t0 : off;

function nz(oc) {
  const b = oc.createBuffer(1, oc.sampleRate, oc.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function tone(oc, o, f, t, du, v, f2, ty = 'sine') {
  if (t < 0 || t >= D) return;
  const s = oc.createOscillator(), a = oc.createGain();
  s.type = ty;
  s.frequency.setValueAtTime(f, t);
  if (f2) s.frequency.exponentialRampToValueAtTime(f2, t + du);
  a.gain.setValueAtTime(0, t);
  a.gain.linearRampToValueAtTime(v, t + 0.01);
  a.gain.exponentialRampToValueAtTime(0.0001, t + du);
  s.connect(a).connect(o);
  s.start(t);
  s.stop(t + du + 0.05);
}
function hit(oc, o, nb, t, du, v, f1, f2) {
  if (t < 0 || t >= D) return;
  const s = oc.createBufferSource(), f = oc.createBiquadFilter(), a = oc.createGain();
  s.buffer = nb; s.loop = true;
  f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(f1, t);
  f.frequency.exponentialRampToValueAtTime(f2, t + du);
  a.gain.setValueAtTime(0, t);
  a.gain.linearRampToValueAtTime(v, t + du * 0.4);
  a.gain.exponentialRampToValueAtTime(0.0001, t + du);
  s.connect(f).connect(a).connect(o);
  s.start(t);
  s.stop(t + du + 0.05);
}

async function mix() {
  const sr = 44100, totalSamples = Math.ceil(sr * D);
  const mo = new OfflineAudioContext(2, totalSamples, sr), so = new OfflineAudioContext(2, totalSamples, sr);
  const mg = mo.createGain();
  mg.gain.setValueAtTime(0, 0);
  mg.gain.linearRampToValueAtTime(1, 1.0);
  mg.gain.setValueAtTime(1, Math.max(0, D - 2.0));
  mg.gain.linearRampToValueAtTime(0, D);
  mg.connect(mo.destination);
  const n1 = nz(mo), bt = 60 / 108;
  const CH = [
    [110, [220, 261.63, 329.63]],
    [87.31, [174.61, 220, 261.63]],
    [130.81, [261.63, 329.63, 392]],
    [98, [196, 246.94, 293.66]]
  ];
  for (let b = 0; b * 4 * bt < D; b++) {
    const [r, c] = CH[b % 4], t = b * 4 * bt;
    c.forEach(f => tone(mo, mg, f, t, 4 * bt, 0.022, 0, 'triangle'));
    for (let k = 0; k < 4; k++) {
      tone(mo, mg, r, t + k * bt, bt * 0.9, 0.09);
      tone(mo, mg, 120, t + k * bt, 0.18, 0.15, 40);
      hit(mo, mg, n1, t + k * bt + bt / 2, 0.06, 0.045, 7000, 9000);
    }
    for (let e = 0; e < 8; e++) {
      tone(mo, mg, c[(e * 2 + (e > 3 ? 1 : 0)) % 3] * 2, t + (e * bt) / 2, 0.3, 0.042, 0, 'triangle');
    }
  }
  const sg = so.createGain();
  sg.connect(so.destination);
  const n2 = nz(so);
  const cues = getSceneCues();
  cues.forEach((c, idx) => {
    if (idx > 0) hit(so, sg, n2, Math.max(0, c[0] - 0.15), 0.45, 0.35, 350, 3400);
  });
  [880, 1109, 1319, 1760].forEach((f, k) => tone(so, sg, f, Math.max(0, VO_D - 1.2 + k * 0.12), 0.7, 0.18));
  mb = await mo.startRendering();
  sb = await so.startRendering();
}

async function init() {
  try {
    const bin = atob(AUDIO_B64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    vb = await ctx.decodeAudioData(u.buffer);
    VO_D = vb.duration;
    D = VO_D + SCENE_DELAY;
    await mix();
    gV = ctx.createGain(); gM = ctx.createGain(); gS = ctx.createGain();
    gV.gain.value = 1; gM.gain.value = 0.45; gS.gain.value = 0.7;
    const ms = ctx.createGain();
    mdest = ctx.createMediaStreamDestination();
    [gV, gM, gS].forEach(x => x.connect(ms));
    ms.connect(ctx.destination);
    ms.connect(mdest);
    st.textContent = 'Siap · Cut Scene 7: Tiga Kesalahan Fatal Pemula di Kubernetes (' + D.toFixed(2) + ' dtk · termasuk 2 dtk jeda baca · 30 FPS).';
  } catch (e) {
    st.textContent = 'Audio gagal dimuat: ' + e.message;
  }
}

function play() {
  if (!ctx || !mb) return;
  ctx.resume();
  if (off >= D - 0.05) off = 0;
  srcs = [[vb, gV], [mb, gM], [sb, gS]].map(a => {
    const s = ctx.createBufferSource();
    s.buffer = a[0];
    s.connect(a[1]);
    s.start(0, off);
    return s;
  });
  t0 = ctx.currentTime;
  playing = true;
  $('pl').textContent = '⏸ Pause';
}

function pause() {
  if (!playing) return;
  off = clock();
  playing = false;
  srcs.forEach(s => { try { s.stop(); } catch (e) {} });
  $('pl').textContent = '▶ Play';
}

function endPlay() {
  pause();
  off = 0;
  if (exporting && rec) {
    exporting = false;
    setTimeout(() => rec.stop(), 400);
  }
}

$('pl').onclick = () => playing ? pause() : play();
$('rs').onclick = () => { const p = playing; pause(); off = 0; if (p) play(); };
$('sk').oninput = e => { const p = playing; pause(); off = (e.target.value / 1000) * D; if (p) play(); };
cV.onchange = () => { if (gV) gV.gain.value = cV.checked ? 1 : 0; };
cM.onchange = () => { if (gM) gM.gain.value = cM.checked ? 0.45 : 0; };
cS.onchange = () => { if (gS) gS.gain.value = cS.checked ? 0.7 : 0; };

const dl = (blob, name) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  return a;
};

$('sr').onclick = () => {
  const f = x => {
    const m = Math.round(x * 1000);
    return new Date(m).toISOString().substr(11, 8) + ',' + String(m % 1000).padStart(3, '0');
  };
  const cues = getSceneCues();
  dl(new Blob([cues.map((c, i) => (i + 1) + '\n' + f(c[0]) + ' --> ' + f(c[1]) + '\n' + c[2] + '\n').join('\n')], { type: 'text/plain' }), 'kubernetes_scene' + SCENE_NUM + '.srt');
};

$('ex').onclick = async () => {
  if (!mb || exporting) { st.textContent = 'Audio belum siap.'; return; }
  pause();
  const M = window.Mediabunny;
  if (M && window.VideoEncoder && window.AudioEncoder) {
    exporting = true;
    $('ex').disabled = true;
    try {
      const sr = 44100, oc = new OfflineAudioContext(2, Math.ceil(sr * D), sr);
      [[vb, cV.checked ? 1 : 0], [mb, cM.checked ? 0.45 : 0], [sb, cS.checked ? 0.7 : 0]].forEach(([b, v]) => {
        if (!b || v <= 0) return;
        const s = oc.createBufferSource(), gn = oc.createGain();
        s.buffer = b; gn.gain.value = v;
        s.connect(gn).connect(oc.destination);
        s.start(0);
      });
      const mixedAudio = await oc.startRendering();
      const out = new M.Output({ format: new M.Mp4OutputFormat(), target: new M.BufferTarget() });
      const vs = new M.CanvasSource(cv, { codec: 'avc', bitrate: M.QUALITY_HIGH });
      out.addVideoTrack(vs, { frameRate: 30 });
      const as = new M.AudioBufferSource({ codec: 'aac', bitrate: 192e3 });
      out.addAudioTrack(as);
      await out.start();
      const N = Math.floor(D * 30);
      for (let i = 0; i < N; i++) {
        render(i / 30);
        await vs.add(i / 30, 1 / 30);
        if (i % 15 === 0) {
          st.textContent = 'Mengekspor MP4: ' + Math.round((i / N) * 100) + '%…';
          await new Promise(r => setTimeout(r, 0));
        }
      }
      await as.add(mixedAudio);
      vs.close(); as.close();
      await out.finalize();
      const a = dl(new Blob([out.target.buffer], { type: 'video/mp4' }), 'kubernetes_scene' + SCENE_NUM + '.mp4');
      st.innerHTML = 'Selesai (MP4 1080×1920 30 FPS). <a href="' + a.href + '" download="kubernetes_scene' + SCENE_NUM + '.mp4">Klik di sini jika belum terunduh</a>.';
      exporting = false;
      $('ex').disabled = false;
      return;
    } catch (err) {
      exporting = false;
      $('ex').disabled = false;
    }
  }
  if (!window.MediaRecorder) { st.textContent = 'Browser tidak mendukung MediaRecorder.'; return; }
  const mt = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  if (!mt) { st.textContent = 'Tidak ada format rekam yang didukung.'; return; }
  off = 0;
  const vs = cv.captureStream(30);
  mdest.stream.getAudioTracks().forEach(t => vs.addTrack(t));
  rec = new MediaRecorder(vs, { mimeType: mt, videoBitsPerSecond: 8e6 });
  chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const ext = mt.startsWith('video/mp4') ? 'mp4' : 'webm';
    const a = dl(new Blob(chunks, { type: mt.split(';')[0] }), 'kubernetes_scene' + SCENE_NUM + '.' + ext);
    st.innerHTML = 'Selesai (' + ext.toUpperCase() + '). <a href="' + a.href + '" download="kubernetes_scene' + SCENE_NUM + '.' + ext + '">Klik di sini</a>.';
    $('ex').disabled = false;
  };
  exporting = true;
  $('ex').disabled = true;
  st.textContent = 'Merekam real-time (' + D.toFixed(0) + ' dtk)… biarkan tab ini terbuka.';
  rec.start(500);
  play();
};

function frame() {
  if (!exporting || rec) {
    const t = clock();
    if (playing && t >= D) endPlay();
    const tt = cl(clock(), 0, D - 0.001);
    render(tt);
    $('sk').value = (tt / D) * 1000;
    $('tm').textContent = fmt(tt) + ' / ' + fmt(D);
  }
  requestAnimationFrame(frame);
}
render(0);
init();
frame();
</script></body></html>
