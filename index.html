<script>
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const $ = id => document.getElementById(id), cV = $('cV'), cS = $('cS'), cC = $('cC'), st = $('st');

const W = 1080, H = 1920, FPS = 30;
const SCENE_DELAY = 2.0; // Jeda baca wajib 2.0 detik per scene
const OUTRO_ANIM_DUR = 4.0;
const OUTRO_DUR = OUTRO_ANIM_DUR + SCENE_DELAY; // 6.0 detik

const VO_FILES = [
  'voiceover-scene-1.wav',
  'voiceover-scene-2.wav',
  'voiceover-scene-3.wav',
  'voiceover-scene-4.wav',
  'voiceover-scene-5.wav',
  'voiceover-scene-6.mp3',
  'voiceover-scene-7.wav',
  'voiceover-scene-8.wav'
];

const VO_DURS_DEFAULT = [
  50.7267,
  47.867,
  47.088,
  37.8176,
  48.28,
  44.75,
  39.503125,
  41.1060833
];

let VO_DURS = [...VO_DURS_DEFAULT];
let DURS = [];
let STARTS = [];
let TOTAL_DUR = 0;
let S7_EXTRA_DUR = 0;
const S7_PLAYBOOK_GLOBAL_START = 328.0; // 5 menit 28 detik (batas akhir [4] kubectl top pod / node)
const S7_ORIG_B5 = 37.4;

function recomputeTimeline() {
  STARTS = [];
  DURS = [];
  let acc = 0;
  for (let i = 0; i < VO_DURS.length; i++) {
    STARTS.push(acc);
    let d = VO_DURS[i] + SCENE_DELAY;
    if (i === 6) {
      const scale = VO_DURS[6] / 39.503125;
      const origB5Local = S7_ORIG_B5 * scale;
      const targetB5Local = Math.max(origB5Local, S7_PLAYBOOK_GLOBAL_START - acc);
      S7_EXTRA_DUR = targetB5Local - origB5Local;
      d = VO_DURS[6] + S7_EXTRA_DUR + SCENE_DELAY;
    }
    DURS.push(d);
    acc += d;
  }
  STARTS.push(acc);
  DURS.push(OUTRO_DUR);
  acc += OUTRO_DUR;
  TOTAL_DUR = acc;
}
recomputeTimeline();

// ============================================================================
// PALET WARNA KANONIKAL DARK TECH THEME (K)
// ============================================================================
const K = {
  bg: '#0e1626',
  bg2: '#13203a',
  ink: '#172235',
  surf: '#22314d',
  iv: '#F6F5EE',
  cob: '#4667FF',
  teal: '#16B99A',
  cor: '#FF765E',
  amb: '#FFC65C',
  peri: '#A3A5F4',
  sl: '#73819A',
  red: '#E5484D',
  wh: '#FFFFFF'
};

const F_SANS = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const F_MONO = '"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';

const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => { x = cl(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eb = x => { x = cl(x); return 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2); };
const lp = (a, b, t) => a + (b - a) * t;

function mixHex(a, b, p) {
  p = cl(p);
  const f = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = f(a), B = f(b);
  return '#' + A.map((v, i) => Math.round(lp(v, B[i], p)).toString(16).padStart(2, '0')).join('');
}

function drawThemeBg(g, w = 1080, h = 1920, tint = null, tintAlpha = 0) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.fillStyle = K.bg;
  g.fillRect(0, 0, 1080, 1920);
  g.fillStyle = K.bg2;
  g.beginPath(); g.arc(980, 160, 300, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(60, 1800, 360, 0, Math.PI * 2); g.fill();
  if (tint && tintAlpha > 0) {
    g.globalAlpha = tintAlpha;
    g.fillStyle = tint;
    g.fillRect(0, 0, 1080, 1920);
  }
  g.restore();
}

function drawR(g, x, y, w, h, r, fill, alpha = 1, stroke = null, lw = 4, dash = []) {
  if (w <= 0 || h <= 0) return;
  g.save();
  g.globalAlpha *= alpha;
  g.beginPath();
  g.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) {
    g.strokeStyle = stroke;
    g.lineWidth = lw;
    g.setLineDash(dash);
    g.stroke();
  }
  g.restore();
}

function drawC(g, x, y, r, fill, alpha = 1, stroke = null, lw = 4) {
  if (r <= 0) return;
  g.save();
  g.globalAlpha *= alpha;
  g.beginPath();
  g.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
  g.restore();
}

function drawT(g, txt, x, y, sz, col, wt = 700, align = 'center', alpha = 1, baseline = 'alphabetic', maxW = undefined) {
  g.save();
  g.globalAlpha *= alpha;
  g.font = `${wt} ${sz}px ${F_SANS}`;
  g.fillStyle = col;
  g.textAlign = align;
  g.textBaseline = baseline;
  if (maxW) g.fillText(String(txt), x, y, maxW);
  else g.fillText(String(txt), x, y);
  g.restore();
}

function drawSubtitleOverlay(g, text) {
  if (!text) return;
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  const line = text.trim();
  const bh = 104;
  const by = 1868 - bh;
  drawR(g, 40, by, 1000, bh, 28, '#000000', 0.72, K.surf, 2);
  drawT(g, line, 540, by + bh / 2 + 2, 57, K.iv, 600, 'center', 1, 'middle', 940);
  g.restore();
}

function findActiveCue(cues, tRaw, scaleFactor) {
  for (let idx = 0; idx < cues.length; idx++) {
    const c = cues[idx];
    const nextStart = idx < cues.length - 1 ? cues[idx + 1][0] : Infinity;
    const endPad = idx === cues.length - 1 ? 1.8 * scaleFactor : 0.12;
    if (tRaw >= c[0] && tRaw < Math.min(c[1] + endPad, nextStart)) {
      return c;
    }
  }
  return null;
}

// ============================================================================
// SCENE 1: 4 STATUS HOROR POD KUBERNETES
// ============================================================================
const S1_REF_D = 50.7267;
const S1_B_REF = [0, 8, 20.2, 28, 35.5, 42.9, S1_REF_D];
const S1_CUES_REF = [
  [0.60, 1.82, "Pernah kebayang nggak?"],
  [1.82, 3.35, "Cuma gara-gara satu Pod mati"],
  [3.35, 4.25, "pada jam 3 pagi,"],
  [4.25, 5.25, "tiba-tiba seluruh"],
  [5.25, 6.38, "cluster Kubernetes-mu"],
  [6.38, 7.55, "ikut runtuh berjamaah?"],
  [8.62, 10.35, "Di bagian 7 yang jadi penutup"],
  [10.35, 12.18, "seri Masterclass Kubernetes ini,"],
  [12.25, 13.78, "kita bakal bongkar 7 jebakan"],
  [13.78, 15.28, "produksi paling mematikan"],
  [15.28, 16.85, "beserta cara menjinakkannya."],
  [17.65, 18.80, "Pertama, kenali"],
  [18.80, 20.15, "4 status horor ini:"],
  [20.45, 21.88, "Status Pending berarti Pod-mu"],
  [21.88, 23.25, "tertahan di luar gedung"],
  [23.25, 24.75, "karena sisa RAM VPS tak cukup,"],
  [24.80, 26.25, "atau klaim storage nyangkut"],
  [26.25, 27.58, "di server lain."],
  [28.12, 29.65, "Status OOMKilled"],
  [29.65, 31.20, "dengan Exit Code 137,"],
  [31.20, 32.92, "berarti Pod-mu ditembak mati"],
  [32.92, 34.65, "karena melewati batas memori."],
  [35.80, 37.30, "Status CrashLoopBackOff,"],
  [37.30, 38.95, "berarti containermu gagal nyala"],
  [38.95, 40.60, "berulang kali hingga ditunda"],
  [40.60, 42.25, "eksponensial sampai 5 menit."],
  [43.10, 44.50, "Dan status Evicted,"],
  [44.50, 46.35, "berarti Kubelet mengusir paksa"],
  [46.35, 48.18, "Pod-mu karena penyimpanan disk"],
  [48.18, 49.95, "VPS sudah penuh di atas 85%."]
];

function renderScene1(g, localT, voDur, showSub = true) {
  const scaleFactor = S1_REF_D / voDur;
  const tRaw = localT * scaleFactor;
  const t = cl(tRaw, 0, S1_REF_D - 0.001); // clamped structural time
  const tAmb = tRaw; // continuous ambient time
  const C = { ink: K.ink, iv: K.iv, co: K.cob, te: K.teal, cr: K.cor, am: K.amb, pe: K.peri, sl: K.sl, dk: K.surf };

  const rr = (c, x, y, w, h, r, f, s, lw) => {
    c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), r);
    if (f) { c.fillStyle = f; c.fill(); }
    if (s) { c.strokeStyle = s; c.lineWidth = lw || 6; c.stroke(); }
  };
  const T = (c, s, x, y, sz, col, al, w) => {
    c.font = `${w || 800} ${sz}px ${F_SANS}`;
    c.fillStyle = col; c.textAlign = al || 'left'; c.textBaseline = 'middle';
    c.fillText(s, x, y);
  };
  const ci = (c, x, y, r, f) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); c.fillStyle = f; c.fill(); };
  const ln = (c, pts, col, w, dash) => {
    c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(...p) : c.moveTo(...p));
    c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round';
    c.setLineDash(dash || []); c.stroke(); c.setLineDash([]);
  };
  const ez = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const seg = (p, a, b) => ez(cl((p - a) / (b - a)));
  const out = x => 1 - Math.pow(1 - cl(x), 3);

  function pod(c, x, y, s, col, rot, dead) {
    c.save(); c.translate(x, y); c.rotate(rot || 0); c.scale(s, s);
    [-22, 0, 22].forEach(a => ci(c, a, -72, 17, C.iv));
    rr(c, -30, -70, 60, 22, 6, C.iv);
    rr(c, -50, -48, 100, 110, 26, col);
    rr(c, -28, -28, 56, 36, 10, 'rgba(23,34,53,.2)');
    if (dead) {
      [-18, 18].forEach(e => { ln(c, [[e - 8, 24], [e + 8, 40]], C.ink, 6); ln(c, [[e + 8, 24], [e - 8, 40]], C.ink, 6); });
    } else {
      ci(c, -18, 32, 7, C.ink); ci(c, 18, 32, 7, C.ink);
    }
    c.restore();
  }

  const bg = c => drawThemeBg(c, 1080, 1920);
  // 4 chips symmetrical: 60 + i*244, width 228 -> right edge 60 + 3*244 + 228 = 1020 (margin 60 left & right)
  function chips(c, a, title, sub, p) {
    const n = ['Pending', 'OOMKilled', 'CrashLoop', 'Evicted'], k = [C.am, C.cr, C.pe, C.te];
    n.forEach((s, i) => {
      const x = 60 + i * 244;
      rr(c, x, 90, 228, 84, 42, i === a ? k[i] : C.dk);
      T(c, s, x + 114, 132, 28, i === a ? C.ink : C.sl, 'center');
    });
    c.save(); c.globalAlpha = out(p * 4);
    T(c, title, 540, 290 - (1 - out(p * 4)) * 30, 92, C.iv, 'center');
    T(c, sub, 540, 380, 40, C.pe, 'center', 600);
    c.restore();
  }

  const B = S1_B_REF;
  const S = [
    (c, p, tt) => {
      bg(c);
      rr(c, 60, 110, 960, 800, 48, K.ink, C.cr, 8);
      ci(c, 120, 170, 16, (tAmb * 2) % 1 < 0.5 ? C.cr : C.dk);
      T(c, 'ALERT · INSIDEN', 160, 170, 34, C.cr);
      const sh = p > 0.3 && p < 0.6 ? Math.sin(tt * 60) * 4 : 0;
      T(c, '03:00', 540 + sh, 390, 230, C.iv, 'center');
      // 6 pods centered at 540: 170 + i*148 -> centers 170, 318, 466, 614, 762, 910 (mean = 540)
      for (let i = 0; i < 6; i++) {
        const k = i === 0 ? seg(p, 0.1, 0.25) : i < 5 ? seg(p, 0.25 + i * 0.09, 0.42 + i * 0.09) : 0;
        pod(c, 170 + i * 148, 700 + k * (i === 3 ? 20 : 0), 1.1, k > 0.5 ? C.cr : C.te, (i === 0 ? -0.22 : 0.15 + 0.08 * i) * k, k > 0.6);
      }
      ln(c, [[110, 820], [970, 820]], C.sl, 6, [14, 14]);
      [['1 Pod Mati Bikin', 1060, 76, C.iv, 0.45], ['Seluruh Klaster Runtuh?!', 1160, 76, C.cr, 0.55], ['Kenali 4 Status Horor Kubernetes Ini!', 1290, 44, C.am, 0.7]].forEach(q => {
        const a = out((p - q[4]) * 5);
        c.globalAlpha = a; T(c, q[0], 540, q[1] + (1 - a) * 50, q[2], q[3], 'center'); c.globalAlpha = 1;
      });
      ['Pending', 'OOMKilled', 'CrashLoop', 'Evicted'].forEach((s, i) => {
        c.globalAlpha = out((p - 0.8 - i * 0.04) * 8);
        rr(c, 60 + i * 244, 1560, 228, 160, 28, C.dk);
        T(c, s, 174 + i * 244, 1640, 30, C.iv, 'center');
        c.globalAlpha = 1;
      });
    },
    (c, p, tt) => {
      bg(c);
      const ps = seg(p, 0.05, 0.3), L = (a, b) => a + (b - a) * ps;
      const k = [['Pending', C.am, 'Tertahan di luar gedung'], ['OOMKilled', C.cr, 'Exit Code 137'], ['CrashLoopBackOff', C.pe, 'Jeda eksponensial'], ['Evicted', C.te, 'Diusir kubelet']];
      T(c, 'Bagian 7 dari 7', 540, L(70, 110), 36, C.pe, 'center', 600);
      rr(c, 60, L(110, 160), 960, L(800, 380), L(48, 40), K.ink, C.cr, 6);
      T(c, '03:00', L(540, 280), L(390, 265), L(230, 96), C.iv, 'center');
      for (let i = 0; i < 6; i++) pod(c, L(170 + i * 148, 470 + i * 100), L(700, 365), L(1.1, 0.7), i < 5 ? C.cr : C.te, i === 0 ? -0.22 : i < 5 ? 0.15 + 0.08 * i : 0, i === 0);
      const a = seg(p, 0.25, 0.33) * (1 - seg(p, 0.42, 0.50));
      c.globalAlpha = a; T(c, '7 jebakan produksi', 540, 800 + (1 - a) * 40, 80, C.iv, 'center');
      for (let i = 0; i < 7; i++) {
        const l = seg(p, 0.28 + i * 0.03, 0.34 + i * 0.03);
        ci(c, 180 + i * 120, 940, 18 + 12 * l, l > 0.5 ? C.am : C.dk);
      }
      T(c, 'dan cara menjinakkannya', 540, 1060, 44, C.pe, 'center', 600);
      c.globalAlpha = 1;
      // 2x2 grid symmetrical: x = 60 + (i%2)*490, width = 470 -> left 60..530, right 550..1020 (centered at 540)
      // Sunk completely below screen from 8s until 14.5s (p=0.495), then slides up together
      k.forEach((q, i) => {
        const o = out((p - 0.495 - i * 0.04) * 5);
        if (o <= 0.001) return;
        const x = 60 + (i % 2) * 490, y = 600 + (i >> 1) * 600 + (1 - o) * 1350;
        rr(c, x, y, 470, 560, 40, C.dk);
        rr(c, x + 30, y, 410, 14, 7, q[1]);
        T(c, q[0], x + 235, y + 90, q[0].length > 10 ? 42 : 52, C.iv, 'center');
        T(c, q[2], x + 235, y + 160, 30, C.pe, 'center', 600);
        pod(c, x + 235, y + 360 + Math.sin(tAmb * 3 + i) * 8, 1.5, q[1], i * 0.1 - 0.1);
      });
    },
    (c, p, tt) => {
      bg(c);
      chips(c, 0, 'Pending', 'Tertahan di luar gedung', p);
      // Symmetrical left & right margins (80px left, 80px right):
      // Left group centered at x=280, Right VPS building at x=560..1000 (width 440, center 780)
      rr(c, 560, 640, 440, 700, 30, C.sl);
      for (let i = 0; i < 6; i++) rr(c, 600 + (i % 2) * 190, 690 + (i >> 1) * 130, 150, 90, 12, C.dk);
      rr(c, 720, 1180, 120, 160, 14, C.ink);
      T(c, 'VPS', 780, 610, 40, C.iv, 'center');
      rr(c, 590, 1400, 380, 50, 25, C.dk);
      rr(c, 590, 1400, 50 + 300 * seg(p, 0.1, 0.5), 50, 25, C.cr);
      T(c, 'RAM sisa tidak cukup', 780, 1500, 34, C.am, 'center', 700);
      const bx = 300 + 130 * seg(p, 0.45, 0.62) - 130 * seg(p, 0.62, 0.75);
      pod(c, bx, 1250, 1.7, C.am, -0.08);
      c.globalAlpha = seg(p, 0.72, 0.85); T(c, '?', 300, 1050, 120, C.am, 'center'); c.globalAlpha = 1;
      rr(c, 120, 1380, 360, 60, 30, C.am); T(c, 'Pending', 300, 1410, 34, C.ink, 'center');
      const e = seg(p, 0.2, 0.5);
      c.lineDashOffset = -tAmb * 40;
      ln(c, [[300, 1130], [300 - 45 * e, 1130 - 270 * e], [190, 760]], C.pe, 6, [16, 14]);
      c.lineDashOffset = 0;
      const s2 = out(p * 3);
      rr(c, 80, 560, 220, 200, 24, C.co);
      T(c, 'server', 190, 640, 34, C.iv, 'center');
      T(c, 'lain', 190, 690, 34, C.iv, 'center');
      c.globalAlpha = s2; T(c, 'PVC nyangkut', 190, 800, 30, C.pe, 'center', 700); c.globalAlpha = 1;
    },
    (c, p, tt) => {
      bg(c);
      chips(c, 1, 'OOMKilled', 'Ditembak karena melewati batas memori', p);
      rr(c, 60, 520, 960, 1000, 44, C.dk);
      // 3 columns symmetrical around x=540: centers at 240 (x=140,w=200), 540 (x=440,w=200), 840 (x=740,w=200)
      const gVal = seg(p, 0.1, 0.45);
      rr(c, 140, 760, 200, 640, 24, C.ink);
      c.save(); c.beginPath(); c.roundRect(140, 760, 200, 640, 24); c.clip();
      c.fillStyle = C.te; c.fillRect(140, 1400 - 448 * gVal, 200, 448 * gVal); c.restore();
      rr(c, 140, 760, 200, 640, 24, null, C.iv, 6);
      [C.co, C.pe, C.am].forEach((k, i) => {
        const h = 270 * seg(p, 0.12 + i * 0.1, 0.3 + i * 0.1);
        if (h > 2) rr(c, 440, 1400 - i * 270 - h, 200, Math.max(h - 6, 1), 16, k);
      });
      const a = seg(p, 0.45, 0.55);

    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  })(7);
  const COL = ['#2b1fff', '#5b52ff', '#8b85ff', '#5b52ff', '#2b1fff', '#ff8b85'];
  const P = [...Array(34)].map(() => {
    const a = rnd() * Math.PI * 2, ring = rnd() < 0.22;
    const sp = 230 + rnd() * 330, t0 = 0.3 + rnd() * 0.25, life = 0.8 + rnd() * 0.5;
    const r = ring ? 7 + rnd() * 5 : 2.5 + rnd() * 4.5;
    const col = ring ? COL[Math.floor(rnd() * 3)] : COL[Math.floor(rnd() * COL.length)];
    return { a, sp, t0, life, r, ring, col };
  });
  const A = [...Array(16)].map(() => ({

function renderOutro(g, t, D9) {
  const eBackAlif = x => { x = cl(x); return 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2); };
  const S0 = 900 / 1621.3;
  const LC = [122.7, 132.9], LW = [810.65, 132.9], DX = LW[0] - LC[0], K_SC = 2.2;
  const RAW = [1217.5, 916.5], CY = 960;
  const TAG = 'Ruang Literasi, Rumah Inovasi';
  const URL_TXT = 'https://alifpustaka.web.id';
  const F_NUNITO = 'Nunito,"Varela Round",' + F_SANS;

  if (typeof Path2D !== 'undefined' && !_alifLogoPath2D) {
    _alifLogoPath2D = ALIF_LOGO_PARTS.map(p => new Path2D(p.d));
    _alifTextPath2D = ALIF_TEXT_PATHS.map(d => new Path2D(d));
  }

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawThemeBg(g, 1080, 1920);

  const ambFade = pr(t, 0.2, 0.8);
  ALIF_PARTICLES.A.forEach(o => {
    const f = (t * 0.12 + o.ph) % 1;
    const cy = o.y - t * 28;
    const op = Math.sin(Math.PI * f) * 0.22 * ambFade;
    if (op > 0.005) drawC(g, o.x, cy, o.r, '#5b52ff', op);
  });

  const u = eio(pr(t, 1.0, 1.55));
  const z = eBackAlif(pr(t, 0.1, 0.95));
  const kz = 0.12 + (K_SC - 0.12) * z;
  const k = kz + (1 - kz) * u;
  const dx = DX * (1 - u);

  const lx = 540 + (LC[0] + dx - LW[0]) * S0, ly = CY;
  const gx = lx + (540 - lx) * 0.5 * u;
  const glowOp = pr(t, 0, 0.6) * (1 - 0.55 * u);
  if (glowOp > 0.005 && typeof g.createRadialGradient === 'function') {
    const grd = g.createRadialGradient(gx, ly, 0, gx, ly, 560);
    if (grd && typeof grd.addColorStop === 'function') {
      grd.addColorStop(0, `rgba(91, 82, 255, ${(0.22 * glowOp).toFixed(4)})`);
      grd.addColorStop(1, 'rgba(91, 82, 255, 0)');
      g.save();
      g.fillStyle = grd;
      g.beginPath(); g.arc(gx, ly, 560, 0, Math.PI * 2); g.fill();
      g.restore();
    }
  }

  [['#5b52ff', 0.32, 1.0, 60, 560, 0.45, 2.4], ['#8b85ff', 0.46, 1.1, 40, 420, 0.32, 1.6]].forEach(([col, a, b, r0, r1, al, sw]) => {
    const q = pr(t, a, b);
    if (q > 0 && q < 1) {
      const e = eo(q);
      drawC(g, 540, CY, r0 + (r1 - r0) * e, null, al * (1 - q), col, sw * (1 - 0.6 * q));
    }
  });

  ALIF_PARTICLES.P.forEach(o => {
    const a = (t - o.t0) / o.life;
    if (a <= 0 || a >= 1) return;
    const d = o.sp * eo(a);
    const px = 540 + Math.cos(o.a) * d;
    const py = CY + Math.sin(o.a) * d;
    const rad = o.r * (o.ring ? (0.6 + a * 1.6) : (1 - a * 0.5));
    const op = Math.pow(1 - a, 1.4) * 0.9;
    if (o.ring) drawC(g, px, py, rad, null, op, o.col, 2.2);
    else drawC(g, px, py, rad, o.col, op);
  });

  g.save();
  g.translate(540, 960);
  g.scale(0.55509, 0.55509);
  g.translate(-810.65, -132.9);

  const logoOp = pr(t, 0.1, 0.35);
  if (logoOp > 0 && _alifLogoPath2D) {
    g.save();
    g.translate(LC[0] + dx, LC[1]);
    g.scale(k, k);
    g.translate(-LC[0], -LC[1]);
    g.translate(-1094.78, -783.59);
    ALIF_LOGO_PARTS.forEach((part, i) => {
      const q = pr(t, 0.05 + i * 0.04, 0.6 + i * 0.04);
      const partOp = logoOp * cl(q * 2.2);
      if (partOp <= 0) return;
      const e = eo(q);
      const vx = part.cx - RAW[0], vy = part.cy - RAW[1];
      const dist = Math.hypot(vx, vy) || 1;
      const m = 70 * (1 - e) / dist;
      const sc = 0.55 + 0.45 * e;
      g.save();
      g.globalAlpha = partOp;
      g.translate(vx * m, vy * m);
      g.translate(part.cx, part.cy);
      g.scale(sc, sc);
      g.translate(-part.cx, -part.cy);
      g.fillStyle = part.fill;
      g.fill(_alifLogoPath2D[i]);
      g.restore();
    });
    g.restore();
  }

  if (_alifTextPath2D) {
    g.save();
    g.translate(-1094.78, -783.59);
    ALIF_TEXT_PATHS.forEach((_, i) => {
      const q = pr(t, 1.1 + i * 0.03, 1.4 + i * 0.03);
      const e = eo(q);
      if (e <= 0) return;
      g.save();
      g.globalAlpha = e;
      g.translate(-34 * (1 - e), 0);
      g.fillStyle = K.iv;
      g.fill(_alifTextPath2D[i]);
      g.restore();
    });
    g.restore();
  }
  g.restore();

  g.save();
  g.font = `700 46px ${F_NUNITO}`;
  const fullTagW = g.measureText(TAG).width;
  const tagX = 540 - fullTagW / 2;
  const n = Math.floor(pr(t, 1.75, 2.95) * TAG.length + 1e-6);
  const subTag = n > 0 ? TAG.slice(0, n) : '';
  if (subTag) {
    g.fillStyle = K.iv;
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillText(subTag, tagX, 1130);
  }
  const subW = subTag ? g.measureText(subTag).width : 0;
  const co = t < 1.7 ? 0 : t < 2.95 ? 1 : t < 3.5 ? (Math.floor((t - 2.95) / 0.18) % 2 ? 0 : 1) : 0;
  if (co > 0) {
    drawR(g, tagX + subW + 4, 1088, 4, 54, 2, '#5b52ff', co);
  }
  g.restore();

  const uo = eo(pr(t, 3.0, 3.55));
  if (uo > 0) {
    g.save();
    g.globalAlpha = uo;
    g.translate(0, 14 * (1 - uo));
    g.font = `600 34px ${F_NUNITO}`;

    g.strokeStyle = K.wh;

    g.lineCap = 'round';
    g.beginPath();
    if (typeof g.ellipse === 'function') g.ellipse(gx2, gy2, 8, 18, 0, 0, Math.PI * 2);
    g.moveTo(gx2 - 18, gy2); g.lineTo(gx2 + 18, gy2);
    g.moveTo(gx2 - 14.5, gy2 - 9.5); g.lineTo(gx2 + 14.5, gy2 - 9.5);
    g.moveTo(gx2 - 14.5, gy2 + 9.5); g.lineTo(gx2 + 14.5, gy2 + 9.5);
    g.stroke();
    g.restore();

    g.fillStyle = K.wh;
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillText(URL_TXT, urlX + 90, 1244);

// ============================================================================
// ITU-R BS.1770-4 / EBU R128 LOUDNESS & TRUE PEAK NORMALIZER
// Voiceover: -10 LUFS, -1 dBTP | SFX: -14 LUFS, -1 dBTP
// ============================================================================
function computeKWeightedMonoPower(buf) {
  const sr = buf.sampleRate, nCh = buf.numberOfChannels, len = buf.length;
  // BS.1770-4 Stage 1 (high-shelf +4dB) & Stage 2 (RLB high-pass ~60Hz) biquad coefficients for 44.1kHz / 48kHz
  const b1_0 = 1.53512485958697, b1_1 = -2.69169618940638, b1_2 = 1.19839281085285;
  const a1_1 = -1.69065929318241, a1_2 = 0.73248077421585;
  const b2_0 = 1.0, b2_1 = -2.0, b2_2 = 1.0;
  const a2_1 = -1.99004745483398, a2_2 = 0.99007225036621;

  const pwr = new Float32Array(len);
  for (let ch = 0; ch < nCh; ch++) {
    const d = buf.getChannelData(ch);
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    let u1 = 0, u2 = 0, v1 = 0, v2 = 0;
    const wCh = 1.0 / nCh;
    for (let i = 0; i < len; i++) {
      const x0 = d[i];
      const y0 = b1_0 * x0 + b1_1 * x1 + b1_2 * x2 - a1_1 * y1 - a1_2 * y2;
      x2 = x1; x1 = x0; y2 = y1; y1 = y0;
      const v0 = b2_0 * y0 + b2_1 * u1 + b2_2 * u2 - a2_1 * v1 - a2_2 * v2;
      u2 = u1; u1 = y0; v2 = v1; v1 = v0;
      pwr[i] += v0 * v0 * wCh;
    }
  }
  return { pwr, sr, len };
}

function measureIntegratedLUFS(buf, isSparseSfx = false) {
  const { pwr, sr, len } = computeKWeightedMonoPower(buf);
  const blockSamples = Math.max(1, Math.floor(sr * (isSparseSfx ? 0.2 : 0.4)));
  const stepSamples = Math.max(1, Math.floor(sr * (isSparseSfx ? 0.05 : 0.1)));
  if (len < blockSamples) return -70;

  const blocks = [];
  for (let start = 0; start + blockSamples <= len; start += stepSamples) {
    let sum = 0;
    for (let i = start; i < start + blockSamples; i++) sum += pwr[i];
    blocks.push(sum / blockSamples);
  }
  if (!blocks.length) return -70;

  // Absolute gate at -70 LUFS (or -60 LUFS for sparse SFX to exclude near-silence tails)
  const absGateThresh = Math.pow(10, ((isSparseSfx ? -55 : -70) + 0.691) / 10);
  const absPassed = blocks.filter(z => z > absGateThresh);
  if (!absPassed.length) return -70;

  const absMean = absPassed.reduce((a, b) => a + b, 0) / absPassed.length;
  // Relative gate at -10 LU below ungated active mean
  const relGateThresh = absMean * Math.pow(10, -10 / 10);
  const relPassed = absPassed.filter(z => z >= relGateThresh);
  const finalMean = (relPassed.length ? relPassed : absPassed).reduce((a, b) => a + b, 0) / (relPassed.length || absPassed.length);
  return -0.691 + 10 * Math.log10(Math.max(1e-12, finalMean));
}

function normalizeAudioBuffer(buf, targetLUFS, maxTruePeakDB = -1.0, isSparseSfx = false) {
  if (!buf) return buf;
  const tpCeiling = Math.pow(10, maxTruePeakDB / 20); // -1.0 dBTP = 0.8912509
  // Account for inter-sample true peaks (~0.15 dB guard) so 4x oversampled true peak stays <= -1.0 dBTP
  const sampleCeiling = tpCeiling * 0.982;
  const nCh = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate;

  // 2-pass iterative loudness + lookahead true-peak limiter so both target LUFS and -1 dBTP are met
  for (let pass = 0; pass < 2; pass++) {
    const currentLUFS = measureIntegratedLUFS(buf, isSparseSfx);
    if (currentLUFS <= -68) break;
    const gain = Math.pow(10, (targetLUFS - currentLUFS) / 20);

    // Apply linear gain first
    for (let ch = 0; ch < nCh; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] *= gain;
    }

    // Lookahead envelope true-peak limiter (1.5ms lookahead, 45ms smooth release)
    const lookahead = Math.max(1, Math.floor(sr * 0.0015));
    const relCoeff = Math.exp(-1 / (sr * 0.045));
    let env = 1.0;
    for (let i = 0; i < len; i++) {
      let maxAbs = 0;
      const end = Math.min(len, i + lookahead);
      for (let ch = 0; ch < nCh; ch++) {
        const d = buf.getChannelData(ch);
        const v0 = Math.abs(d[i]);
        if (v0 > maxAbs) maxAbs = v0;
        // Inter-sample midpoint check for true peak
        if (i + 1 < end) {
          const mid = Math.abs(0.5 * (d[i] + d[i + 1]));
          if (mid * 1.05 > maxAbs) maxAbs = mid * 1.05;
        }
      }
      const neededGain = maxAbs > sampleCeiling ? sampleCeiling / maxAbs : 1.0;
      if (neededGain < env) {
        env = neededGain;
      } else {
        env = relCoeff * env + (1 - relCoeff) * Math.min(1.0, neededGain);
      }
      if (env < 1.0) {
        for (let ch = 0; ch < nCh; ch++) {
          const d = buf.getChannelData(ch);
          d[i] *= env;
        }
      }
      // Hard true-peak safety clamp at -1.0 dBTP
      for (let ch = 0; ch < nCh; ch++) {
        const d = buf.getChannelData(ch);
        if (d[i] > sampleCeiling) d[i] = sampleCeiling;
        else if (d[i] < -sampleCeiling) d[i] = -sampleCeiling;
      }
    }
  }
  return buf;
}

    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), st + d);
    g.gain.setValueAtTime(0.0001, st);
    g.gain.linearRampToValueAtTime(v, st + 0.01);

function scheduleOutroSfx(oc, dst, nb, oStart) {
  const tone = (f, t, du, v, f2 = 0, ty = 'sine') => {
    if (t < 0 || t + du >= TOTAL_DUR) return;
    const s = oc.createOscillator(), a = oc.createGain();
    s.type = ty;
    s.frequency.setValueAtTime(Math.max(20, f), t);
    if (f2) s.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + du);
    a.gain.setValueAtTime(0.0001, t);
    a.gain.linearRampToValueAtTime(v, t + 0.01);
    a.gain.exponentialRampToValueAtTime(0.0001, t + du);
    s.connect(a).connect(dst);
    s.start(t);
    s.stop(t + du + 0.03);
  };
  const hit = (t, du, v, f1, f2) => {
    if (t < 0 || t + du >= TOTAL_DUR) return;
    const s = oc.createBufferSource(), f = oc.createBiquadFilter(), a = oc.createGain();
    s.buffer = nb; s.loop = true;
    f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(Math.max(20, f1), t);
    f.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + du);
    a.gain.setValueAtTime(0.0001, t);
    a.gain.linearRampToValueAtTime(v, t + du * 0.4);
    a.gain.exponentialRampToValueAtTime(0.0001, t + du);
    s.connect(f).connect(a).connect(dst);
    s.start(t);
    s.stop(t + du + 0.03);
  };
  hit(oStart + 0.08, 0.55, 0.35, 300, 3400);
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, k) => tone(f, oStart + 0.32 + k * 0.08, 0.9, 0.18, 0, 'triangle'));
  for (let k = 0; k < 18; k++) tone(1800 + (k % 3) * 200, oStart + 1.75 + k * 0.065, 0.03, 0.06, 0, 'square');
  [659.25, 987.77, 1318.5].forEach((f, k) => tone(f, oStart + 3.05 + k * 0.09, 0.8, 0.16));
}

async function buildAudioTracks() {
  const sr = 44100, totalSamples = Math.ceil(sr * TOTAL_DUR);

  // 1. Combined Voiceover Track (normalized per scene and globally to -10 LUFS, -1 dBTP)
  const voOffline = new OfflineAudioContext(2, totalSamples, sr);
  vBufs.forEach((vb, idx) => {
    if (!vb) return;
    normalizeAudioBuffer(vb, -10.0, -1.0, false);
    const s = voOffline.createBufferSource();
    s.buffer = vb;
    s.connect(voOffline.destination);
    s.start(STARTS[idx]);
  });
  fullVoBuf = await voOffline.startRendering();
  normalizeAudioBuffer(fullVoBuf, -10.0, -1.0, false);

  // 2. Combined Sound Effects Track (All Scenes 1–8 Original SFX + Outro, normalized to -14 LUFS, -1 dBTP)
  const so = new OfflineAudioContext(2, totalSamples, sr);
  const sg = so.createGain();
  sg.connect(so.destination);
  const nb = nz(so);

  scheduleScene1Sfx(so, sg, nb, STARTS[0], VO_DURS[0] / S1_REF_D);
  scheduleScene2Sfx(so, sg, nb, STARTS[1], VO_DURS[1] / S2_REF_D);
  scheduleScene3Sfx(so, sg, nb, STARTS[2], VO_DURS[2] / S3_REF_D);
  scheduleScene4Sfx(so, sg, nb, STARTS[3], VO_DURS[3] / S4_REF_D);
  scheduleScene5Sfx(so, sg, nb, STARTS[4], VO_DURS[4] / S5_REF_D);
  scheduleScene6Sfx(so, sg, nb, STARTS[5], VO_DURS[5] / S6_REF_D);
  scheduleScene7Sfx(so, sg, nb, STARTS[6], VO_DURS[6] / S7_REF_D);
  scheduleScene8Sfx(so, sg, nb, STARTS[7], VO_DURS[7] / S8_REF_D);
  scheduleOutroSfx(so, sg, nb, STARTS[8]);

  sb = await so.startRendering();
  normalizeAudioBuffer(sb, -14.0, -1.0, true);
}

async function initAudio() {
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    let loadedCount = 0;
    for (let i = 0; i < VO_FILES.length; i++) {
      try {
        st.textContent = `Memuat audio Scene ${i + 1}/8 (${VO_FILES[i]})…`;
        const res = await fetch(VO_FILES[i]);
        if (res.ok) {
          const ab = await res.arrayBuffer();
          const decoded = await ctx.decodeAudioData(ab);
          vBufs[i] = decoded;
          VO_DURS[i] = decoded.duration;
          loadedCount++;
        }
      } catch (err) {
        console.warn('Fallback duration for ' + VO_FILES[i], err);
      }
    }
    recomputeTimeline();
    st.textContent = 'Menyusun trek narasi (-10 LUFS, -1 dBTP) dan efek suara lengkap (-14 LUFS, -1 dBTP)…';
    await buildAudioTracks();
    gV = ctx.createGain(); gS = ctx.createGain();
    gV.gain.value = cV.checked ? 1.0 : 0;
    gS.gain.value = cS.checked ? 1.0 : 0;
    const ms = ctx.createGain();
    mdest = ctx.createMediaStreamDestination();
    [gV, gS].forEach(x => x.connect(ms));
    ms.connect(ctx.destination);
    ms.connect(mdest);
    st.textContent = `Siap · Full Cutscene Kubernetes Bagian 7 (Scene 1–8 + Outro · Total ${fmt(TOTAL_DUR)} / ${TOTAL_DUR.toFixed(1)} dtk · 30 FPS · VO -10 LUFS / SFX -14 LUFS · ${loadedCount}/8 VO dimuat).`;
  } catch (e) {
    st.textContent = 'Audio siap dalam mode visual: ' + e.message;
  }
}

function play() {
  if (!ctx || !sb) return;
  ctx.resume();
  if (off >= TOTAL_DUR - 0.05) off = 0;
  srcs = [[fullVoBuf, gV], [sb, gS]].map(a => {
    if (!a[0]) return null;
    const s = ctx.createBufferSource();
    s.buffer = a[0];
    s.connect(a[1]);
    s.start(0, off);
    return s;
  }).filter(Boolean);
  t0 = ctx.currentTime;
  playing = true;
  $('pl').textContent = '⏸ Pause';
}

function pause() {
  if (!playing) return;
  off = clock();
  playing = false;
  srcs.forEach(s => { try { s.stop(); } catch (e) {} });
  srcs = [];
  $('pl').textContent = '▶ Play';
}

function jumpToScene(idx) {
  const wasPlaying = playing;
  pause();
  off = STARTS[idx] || 0;
  renderMaster(off);
  $('sk').value = (off / TOTAL_DUR) * 1000;
  $('tm').textContent = fmt(off) + ' / ' + fmt(TOTAL_DUR);
  if (wasPlaying) play();
}

function endPlay() {
  pause();
  off = 0;
  if (exporting && rec) {
    exporting = false;
    setTimeout(() => rec.stop(), 400);
  }
}

$('pl').onclick = () => playing ? pause() : play();
$('rs').onclick = () => { const p = playing; pause(); off = 0; if (p) play(); };
$('sk').oninput = e => { const p = playing; pause(); off = (e.target.value / 1000) * TOTAL_DUR; if (p) play(); };
cV.onchange = () => { if (gV) gV.gain.value = cV.checked ? 1.0 : 0; };
cS.onchange = () => { if (gS) gS.gain.value = cS.checked ? 1.0 : 0; };

const dl = (blob, name) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  return a;
};

$('sr').onclick = () => {
  const f = x => {
    const m = Math.round(x * 1000);
    return new Date(m).toISOString().substr(11, 8) + ',' + String(m % 1000).padStart(3, '0');
  };
  const cues = getAllCombinedCues();
  dl(new Blob([cues.map((c, i) => (i + 1) + '\n' + f(c[0]) + ' --> ' + f(c[1]) + '\n' + c[2] + '\n').join('\n')], { type: 'text/plain' }), 'kubernetes-part-7-full.srt');
};

async function ensureMediabunny() {
  if (window.Mediabunny) return window.Mediabunny;
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/mediabunny@1.25.0/dist/bundles/mediabunny.min.mjs');
    if (mod && mod.Output) {
      window.Mediabunny = mod;
      return mod;
    }
  } catch (e) {
    console.warn('ESM import Mediabunny fallback:', e);
  }
  try {
    const r = await fetch('https://cdn.jsdelivr.net/npm/mediabunny@1.25.0/dist/bundles/mediabunny.min.cjs');
    const code = await r.text();
    const m = { exports: {} };
    new Function('module', 'exports', code)(m, m.exports);
    if (m.exports && m.exports.Output) {
      window.Mediabunny = m.exports;
      return m.exports;
    }
  } catch (e) {
    console.warn('Fetch eval Mediabunny fallback:', e);
  }
  return null;
}

    let lastTimescale = 1000;
    function walk(start, end) {
      let pos = start;
      while (pos + 8 <= end) {
        let sz = dv.getUint32(pos);
        const tp = String.fromCharCode(dv.getUint8(pos + 4), dv.getUint8(pos + 5), dv.getUint8(pos + 6), dv.getUint8(pos + 7));
        let hdr = 8;
        if (sz === 1) {
          if (pos + 16 > end) break;
          sz = Number(dv.getBigUint64(pos + 8));
          hdr = 16;
        } else if (sz === 0) {
          sz = end - pos;
        }
        if (sz < hdr || pos + sz > end) break;
        const body = pos + hdr;
        if (containers.has(tp)) {
          walk(body, pos + sz);
        } else if (tp === 'mvhd' || tp === 'mdhd') {
          const ver = dv.getUint8(body);
          if (ver === 1 && body + 36 <= pos + sz) {
            const ts = dv.getUint32(body + 20) || 1000;
            if (tp === 'mvhd') lastTimescale = ts;
            const cur = Number(dv.getBigUint64(body + 24));
            if (cur === 0) dv.setBigUint64(body + 24, BigInt(Math.round(durSec * ts)));
          } else if (ver === 0 && body + 24 <= pos + sz) {
            const ts = dv.getUint32(body + 12) || 1000;
            if (tp === 'mvhd') lastTimescale = ts;
            const cur = dv.getUint32(body + 16);
            if (cur === 0) dv.setUint32(body + 16, Math.round(durSec * ts));
          }
        } else if (tp === 'tkhd') {
          const ver = dv.getUint8(body);
          if (ver === 1 && body + 36 <= pos + sz) {
            const cur = Number(dv.getBigUint64(body + 28));
            if (cur === 0) dv.setBigUint64(body + 28, BigInt(Math.round(durSec * lastTimescale)));
          } else if (ver === 0 && body + 24 <= pos + sz) {
            const cur = dv.getUint32(body + 20);
            if (cur === 0) dv.setUint32(body + 20, Math.round(durSec * lastTimescale));
          }
        } else if (tp === 'mehd') {
          const ver = dv.getUint8(body);
          if (ver === 1 && body + 12 <= pos + sz) {
            const cur = Number(dv.getBigUint64(body + 4));
            if (cur === 0) dv.setBigUint64(body + 4, BigInt(Math.round(durSec * lastTimescale)));
          } else if (ver === 0 && body + 8 <= pos + sz) {
            const cur = dv.getUint32(body + 4);
            if (cur === 0) dv.setUint32(body + 4, Math.round(durSec * lastTimescale));
          }
        }
        pos += sz;
      }
    }
    walk(0, len);
  } catch (e) {
    console.warn('patchMp4Duration warning:', e);
  }
  return ab;
}

$('ex').onclick = async () => {
  if (!sb || exporting) { st.textContent = 'Audio sedang disiapkan, mohon tunggu sebentar…'; return; }
  pause();
  st.textContent = 'Memuat modul encoder MP4 (FastStart & Seekable)…';
  const M = await ensureMediabunny();
  const totalFrames = Math.round(TOTAL_DUR * FPS);
  const exactDur = totalFrames / FPS;

  if (window.VideoEncoder) {
    exporting = true;
    $('ex').disabled = true;
    try {
      let sr = 48000;
      let aacSupported = false;
      if (window.AudioEncoder) {
        for (const candidateSr of [48000, 44100]) {
          try {
            const sup = await AudioEncoder.isConfigSupported({ codec: 'mp4a.40.2', sampleRate: candidateSr, numberOfChannels: 2, bitrate: 128000 });
            if (sup && sup.supported) { sr = candidateSr; aacSupported = true; break; }
          } catch (e) {}
        }
      }
      const oc = new OfflineAudioContext(2, Math.ceil(sr * exactDur), sr);
      [[fullVoBuf, cV.checked ? 1.0 : 0], [sb, cS.checked ? 1.0 : 0]].forEach(([b, v]) => {
        if (!b || v <= 0) return;
        const s = oc.createBufferSource(), gn = oc.createGain();
        s.buffer = b; gn.gain.value = v;
        s.connect(gn).connect(oc.destination);
        s.start(0);
      });
      const mixedAudio = await oc.startRendering();

      let bestAvc = null;
      const avcCandidates = ['avc1.640028', 'avc1.64002a', 'avc1.4d0028', 'avc1.4d002a', 'avc1.42E028', 'avc1.420028', 'avc1.42E02a', 'avc1.42002a', 'avc1.42E01E'];
      for (const c of avcCandidates) {
        try {
          const sup = await VideoEncoder.isConfigSupported({ codec: c, width: W, height: H, bitrate: 6000000, framerate: FPS });
          if (sup && sup.supported) { bestAvc = c; break; }
        } catch (e) {}
      }

      if (M) {
        const mp4Fmt = new M.Mp4OutputFormat({ fastStart: 'in-memory' });
        const vc = bestAvc ? 'avc' : ((await M.getFirstEncodableVideoCodec(mp4Fmt.getSupportedVideoCodecs(), { width: W, height: H })) || 'avc');
        const out = new M.Output({ format: mp4Fmt, target: new M.BufferTarget() });
        const vsOpts = { codec: vc, bitrate: M.QUALITY_HIGH, keyFrameInterval: 1 };
        if (bestAvc && vc === 'avc') vsOpts.fullCodecString = bestAvc;
        const vs = new M.CanvasSource(cv, vsOpts);
        out.addVideoTrack(vs, { frameRate: FPS });
        let as = null;
        if (window.AudioEncoder) {
          const acd = aacSupported ? 'aac' : (await M.getFirstEncodableAudioCodec(mp4Fmt.getSupportedAudioCodecs(), { numberOfChannels: 2, sampleRate: sr }));
          if (acd) {
            as = new M.AudioBufferSource({ codec: acd, bitrate: acd.startsWith('pcm') ? undefined : 128000 });
            out.addAudioTrack(as);
          }
        }
        await out.start();
        if (as) {
          await as.add(mixedAudio);
          as.close();
        }
        for (let i = 0; i < totalFrames; i++) {
          renderMaster(i / FPS);
          await vs.add(i / FPS, 1 / FPS);
          if (i % 15 === 0) {
            st.textContent = 'Mengekspor MP4 (1080×1920 30 FPS · FastStart & Seekable): ' + Math.round((i / totalFrames) * 100) + '%…';
            await new Promise(r => setTimeout(r, 0));
          }
        }
        vs.close();
        st.textContent = 'Menyusun tabel indeks durasi & seekbar MP4 (moov fastStart)…';
        await new Promise(r => setTimeout(r, 0));
        await out.finalize();
        renderMaster(off);
        const patched = patchMp4Duration(out.target.buffer, exactDur);
        const a = dl(new Blob([patched], { type: 'video/mp4' }), 'kubernetes-part-7-full.mp4');
        st.innerHTML = 'Selesai (MP4 1080×1920 30 FPS · Durasi ' + fmt(exactDur) + ' · Seekable). <a href="' + a.href + '" download="kubernetes-part-7-full.mp4">Klik di sini jika belum terunduh</a>.';
        exporting = false;
        $('ex').disabled = false;
        return;
      } else if (window.Mp4Muxer && bestAvc) {
        const target = new window.Mp4Muxer.ArrayBufferTarget();
        const muxer = new window.Mp4Muxer.Muxer({
          target,
          video: { codec: 'avc', width: W, height: H, frameRate: FPS },
          audio: aacSupported ? { codec: 'aac', numberOfChannels: 2, sampleRate: sr } : undefined,
          fastStart: 'in-memory',
          firstTimestampBehavior: 'offset'
        });
        const vEnc = new VideoEncoder({
          output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
          error: e => console.error('VideoEncoder error:', e)
        });
        vEnc.configure({ codec: bestAvc, width: W, height: H, bitrate: 6000000, framerate: FPS });

        if (aacSupported && window.AudioEncoder && window.AudioData) {
          const aEnc = new AudioEncoder({
            output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
            error: e => console.error('AudioEncoder error:', e)
          });
          aEnc.configure({ codec: 'mp4a.40.2', numberOfChannels: 2, sampleRate: sr, bitrate: 128000 });
          const ch0 = mixedAudio.getChannelData(0), ch1 = mixedAudio.getChannelData(1);
          const step = 1024 * 4;
          for (let offset = 0; offset < ch0.length; offset += step) {
            const frames = Math.min(step, ch0.length - offset);
            const planar = new Float32Array(frames * 2);
            planar.set(ch0.subarray(offset, offset + frames), 0);
            planar.set(ch1.subarray(offset, offset + frames), frames);
            const ad = new AudioData({
              format: 'f32-planar',
              sampleRate: sr,
              numberOfFrames: frames,
              numberOfChannels: 2,
              timestamp: Math.round((offset / sr) * 1e6),
              data: planar
            });
            aEnc.encode(ad);
            ad.close();
          }
          await aEnc.flush();
          aEnc.close();
        }

        for (let i = 0; i < totalFrames; i++) {
          renderMaster(i / FPS);
          const vf = new VideoFrame(cv, { timestamp: Math.round((i / FPS) * 1e6), duration: Math.round((1 / FPS) * 1e6) });
          vEnc.encode(vf, { keyFrame: i % FPS === 0 });
          vf.close();
          if (vEnc.encodeQueueSize > 4) {
            await new Promise(r => vEnc.addEventListener('dequeue', r, { once: true }));
          }
          if (i % 15 === 0) {
            st.textContent = 'Mengekspor MP4 (1080×1920 30 FPS · FastStart & Seekable): ' + Math.round((i / totalFrames) * 100) + '%…';
            await new Promise(r => setTimeout(r, 0));
          }
        }
        await vEnc.flush();
        vEnc.close();
        muxer.finalize();
        renderMaster(off);
        const patched = patchMp4Duration(target.buffer, exactDur);
        const a = dl(new Blob([patched], { type: 'video/mp4' }), 'kubernetes-part-7-full.mp4');
        st.innerHTML = 'Selesai (MP4 1080×1920 30 FPS · Durasi ' + fmt(exactDur) + ' · Seekable). <a href="' + a.href + '" download="kubernetes-part-7-full.mp4">Klik di sini jika belum terunduh</a>.';
        exporting = false;
        $('ex').disabled = false;
        return;
      }
    } catch (err) {
      console.warn('WebCodecs MP4 export fallback to MediaRecorder:', err);
      exporting = false;
      $('ex').disabled = false;
    }
  }
  if (!window.MediaRecorder) { st.textContent = 'Browser tidak mendukung MediaRecorder.'; return; }
  const mt = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  if (!mt) { st.textContent = 'Tidak ada format rekam yang didukung.'; return; }
  off = 0;
  const vs = cv.captureStream(30);
  mdest.stream.getAudioTracks().forEach(t => vs.addTrack(t));
  rec = new MediaRecorder(vs, { mimeType: mt, videoBitsPerSecond: 8e6 });
  chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    const ext = mt.startsWith('video/mp4') ? 'mp4' : 'webm';
    let finalBlob = new Blob(chunks, { type: mt.split(';')[0] });
    const M2 = await ensureMediabunny();
    if (M2 && M2.Input && M2.Conversion && M2.BlobSource) {
      try {
        st.textContent = 'Menyusun metadata durasi & indeks seekbar video…';
        const inp = new M2.Input({ source: new M2.BlobSource(finalBlob), formats: M2.ALL_FORMATS });
        const out = new M2.Output({
          format: ext === 'mp4' ? new M2.Mp4OutputFormat({ fastStart: 'in-memory' }) : new M2.WebMOutputFormat(),
          target: new M2.BufferTarget()
        });
        const conv = await M2.Conversion.init({ input: inp, output: out });
        if (conv.isValid) {
          await conv.execute();
          const buf = ext === 'mp4' ? patchMp4Duration(out.target.buffer, TOTAL_DUR) : out.target.buffer;
          finalBlob = new Blob([buf], { type: ext === 'mp4' ? 'video/mp4' : 'video/webm' });
        }
      } catch (e) {
        console.warn('Remux fallback skipped:', e);
      }
    }
    if (ext === 'mp4') {
      try {
        const ab = await finalBlob.arrayBuffer();
        finalBlob = new Blob([patchMp4Duration(ab, TOTAL_DUR)], { type: 'video/mp4' });
      } catch (e) {}
    }
    const a = dl(finalBlob, 'kubernetes-part-7-full.' + ext);
    st.innerHTML = 'Selesai (' + ext.toUpperCase() + ' · Durasi ' + fmt(TOTAL_DUR) + ' · Seekable). <a href="' + a.href + '" download="kubernetes-part-7-full.' + ext + '">Klik di sini</a>.';
    $('ex').disabled = false;
  };
  exporting = true;
  $('ex').disabled = true;
  st.textContent = 'Merekam real-time (' + TOTAL_DUR.toFixed(0) + ' dtk)… biarkan tab ini terbuka.';
  rec.start(500);
  play();
};

function frame() {
  if (!exporting || rec) {
    const t = clock();
    if (playing && t >= TOTAL_DUR) endPlay();
    const tt = cl(clock(), 0, TOTAL_DUR - 0.001);
    renderMaster(tt);
    $('sk').value = (tt / TOTAL_DUR) * 1000;
    $('tm').textContent = fmt(tt) + ' / ' + fmt(TOTAL_DUR);
  }
  requestAnimationFrame(frame);
}

renderMaster(0);
initAudio();
frame();
